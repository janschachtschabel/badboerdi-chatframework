services:
  backend:
    image: ${DOCKERHUB_USER:-jschachtschabel}/badboerdi-backend:latest
    build:
      context: ./backend
    container_name: badboerdi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ── LLM Provider ─────────────────────────────────────────
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - B_API_KEY=${B_API_KEY:-}
      - B_API_BASE_URL=${B_API_BASE_URL:-}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-}
      - LLM_EMBED_MODEL=${LLM_EMBED_MODEL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # ── GPT-5 tuning (nur bei LLM_PROVIDER=openai + GPT-5-Modellen wirksam)
      - LLM_VERBOSITY=${LLM_VERBOSITY:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      # ── Embedding override (fuer exotische Modelle)
      - EMBED_DIM=${EMBED_DIM:-}
      # ── Speech (STT/TTS) — sprechen immer direkt OpenAI
      - STT_MODEL=${STT_MODEL:-}
      - TTS_MODEL=${TTS_MODEL:-}
      - SPEECH_FORCE_ENABLE=${SPEECH_FORCE_ENABLE:-}
      # ── MCP / RAG ─────────────────────────────────────────────
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
      # Base-URL des edu-sharing-Repos, aus dem die wlo_url-/preview_url-
      # Links zusammengebaut werden. Muss zur MCP_SERVER_URL passen, weil
      # Node-IDs sonst auf das falsche Repo zeigen (Prod-URL + Staging-ID
      # = 404). Default Production: https://redaktion.openeduhub.net.
      # Staging-Wert:                https://repository.staging.openeduhub.net
      - REPO_BASE_URL=${REPO_BASE_URL:-}
      - RAG_TOP_K=${RAG_TOP_K:-}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-}
      - RAG_MAX_CHARS_PER_AREA=${RAG_MAX_CHARS_PER_AREA:-}
      # ── Evaluation (automatisierte Persona-Dialog-Tests) ───────
      - EVAL_CHAT_URL=${EVAL_CHAT_URL:-}
      - EVAL_SIMULATOR_MODEL=${EVAL_SIMULATOR_MODEL:-}
      - EVAL_JUDGE_MODEL=${EVAL_JUDGE_MODEL:-}
      # ── Security / Ops ─────────────────────────────────────────
      - STUDIO_API_KEY=${STUDIO_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Guide-Mode Cross-TLD-Allow-Liste. Leer = YAML-Default aus
      # chatbots/wlo/v1/01-base/guide-mode.yaml (trusted_domains).
      # Gesetzt = überschreibt die YAML-Liste komplett (Komma- oder
      # Whitespace-separiert, ohne Protokoll/Trailing-Slash).
      - GUIDE_TRUSTED_DOMAINS=${GUIDE_TRUSTED_DOMAINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_PATH=/data/badboerdi.db
      # ── RAG-Reranker an/aus ────────────────────────────────────
      # Default: an (Cross-Encoder ONNX, ~150-300 MB RAM, präzisere
      # Top-1-Sortierung). Bei kleinen vServern (≤ 2 GB) auf "false"
      # setzen — RAG läuft dann mit Embedding-only-Ranking weiter.
      - RAG_RERANKER_ENABLED=${RAG_RERANKER_ENABLED:-true}
      - BOERDI_MAX_INGEST_MB=${BOERDI_MAX_INGEST_MB:-}
      # ── Karten-Auswahl & Ranking (Suchergebnis-Kacheln) ───────
      # Doku der Werte/Defaults: backend/.env.example
      - CARD_CE_TOP_N=${CARD_CE_TOP_N:-}
      - CARD_CE_GATE_COLLECTION=${CARD_CE_GATE_COLLECTION:-}
      - CARD_CE_GATE_CONTENT=${CARD_CE_GATE_CONTENT:-}
      - CHAT_DISABLE_SELECT_TOP_CARDS=${CHAT_DISABLE_SELECT_TOP_CARDS:-}
      - CHAT_INLINE_QUICK_REPLIES=${CHAT_INLINE_QUICK_REPLIES:-}
      - CARD_PIPELINE_V2=${CARD_PIPELINE_V2:-}
    # ── Memory-Limits ──────────────────────────────────────────
    # Backend braucht im Lastfall (parallele Embedding-Batches +
    # ONNX-Reranker + RAG-Cache) bis zu ~1.8 GB. Limit auf 2 GB
    # passt für 4-GB-vServer (lässt Headroom für Studio + Caddy +
    # OS). Swap-Limit gleich groß = kein Swap-Thrashing.
    # Auf 2-GB-Servern: ``RAG_RERANKER_ENABLED=false`` + Werte
    # halbieren (mem_limit: 1g, memswap_limit: 2g + Host-Swap).
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    memswap_limit: ${BACKEND_MEMSWAP_LIMIT:-2g}
    volumes:
      - backend_data:/data
      - ./backend/chatbots:/app/chatbots
      - ./backend/knowledge:/app/knowledge
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  studio:
    image: ${DOCKERHUB_USER:-jschachtschabel}/badboerdi-studio:latest
    build:
      context: ./studio
    container_name: badboerdi-studio
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:8000
      - STUDIO_API_KEY=${STUDIO_API_KEY:-}
      - STUDIO_PASSWORD=${STUDIO_PASSWORD:-}
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  chatbot:
    image: ${DOCKERHUB_USER:-jschachtschabel}/badboerdi-chatbot:latest
    build:
      context: ./chatbot
    container_name: badboerdi-chatbot
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Browser-accessible URL of the backend — must be reachable from the
      # end-user's browser, NOT the docker-internal hostname.
      - BACKEND_URL=${CHATBOT_BACKEND_URL:-http://localhost:8000}
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    # nickfedor/watchtower ist der gepflegte Fork — containrrr/watchtower
    # ist seit Apr 2024 archiviert und nutzt eine alte Docker-Client-API
    # (1.25), die moderne Daemons (>= Docker 19.03) nicht mehr akzeptieren
    # → Restart-Loop mit "client version 1.25 is too old".
    image: nickfedor/watchtower:latest
    container_name: badboerdi-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # Optional: Benachrichtigungen (z. B. Slack/Email) via WATCHTOWER_NOTIFICATIONS

volumes:
  backend_data:
