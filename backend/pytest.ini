[pytest]
# Kern-Pipeline-Regressionsnetz. Lauf:  python -m pytest   (aus backend/)
# Deterministisch & offline — keine LLM-/Netz-Calls (LLM-Stufen werden in
# den Safety-Tests gemockt; Config-Integrität liest die echten YAML/MD).
testpaths = tests
pythonpath = .
addopts = -q --tb=short
# pytest-asyncio ist im Env installiert; wir nutzen asyncio.run statt der
# Plugin-Fixtures — diese Zeile unterdrückt nur die Default-Scope-Warnung.
asyncio_default_fixture_loop_scope = function
