# Generic routing rules — Phase 1 (shadow-mode)
#
# These rules mirror the deterministic override blocks that today live
# scattered across chat.py and llm_service.py. The intent is not to add
# new behavior in Phase 1 — only to express the existing logic as data,
# so the rule engine can be evaluated in shadow against the live router.
#
# Schema:
#   id          : unique identifier (string)
#   description : free-text human note (string)
#   priority    : integer; higher runs first
#   when        : condition tree using {all,any,not,<path>:{<op>:arg}}
#   then        : effect dict, keys from rule_engine._KNOWN_EFFECTS
#                 plus optional ``stop_on_match: true``.
#
# Available paths in the context dict:
#   intent, state, persona                — top-level scalars
#   entities.<key>, entity.<key>          — extracted slot values
#   message                               — raw user message (lowercased
#                                           by the integration layer)
#   signals                               — list of classifier signals
#   session_state.<dotted>                — prior turn entities/state
#   canvas_state.<dotted>                 — current canvas markdown etc.
#   safety.<dotted>                       — safety verdict + enforced pattern

rules:
  # ── R-1: Safety override always wins ────────────────────────────
  - id: rule_safety_override
    description: "Safety layer enforced a specific pattern (e.g. PAT-CRISIS)."
    priority: 100
    when:
      safety.enforced_pattern: { non_empty: true }
    then:
      # NOTE: in shadow mode we cannot resolve template strings yet, so
      # we simply mark that an enforcement exists. The integration layer
      # is responsible for reading safety.enforced_pattern itself when
      # the engine indicates a safety hit (via fired_rules).
      enforced_pattern_id: "__from_safety__"
      stop_on_match: true

  # ── R-2: Canvas-Edit on existing markdown ───────────────────────
  # SHADOW for now — the live router has its own canvas-edit fast-path
  # in chat.py:_wants_edit. Activating this rule live would double-route.
  # Leave shadow until that legacy path is replaced by the engine.
  - id: rule_canvas_edit
    description: "Edit-verb on existing canvas markdown → INT-W-12 + canvas_edit."
    priority: 90
    live: false
    when:
      all:
        - canvas_state.markdown: { non_empty: true }
        - any:
            - intent: { eq: "INT-W-12" }
            - message:
                regex: "(kürzer|kuerzer|einfacher|verständlicher|verstaendlicher|überarbeite|ueberarbeite|ändere|aendere|umformuliere|ergänze|ergaenze|streiche|loesch|lösch)"
        - not:
            message:
              regex: "neues?\\s+(arbeitsblatt|quiz|material|infoblatt|lerngeschichte|versuchsanleitung|glossar|präsentation|praesentation|checkliste)"
    then:
      intent_override: "INT-W-12"
      direct_action: "canvas_edit"

  # ──────────────────────────────────────────────────────────────
  # Pre-Route: INT-W-11 Disambiguation (migrated from llm_service.py)
  #
  # The LLM classifier systematically over-selects INT-W-11 when a
  # material-type word appears anywhere in the message ("Arbeitsblatt",
  # "Pressemitteilung", "Lernpfad" …). The rules below catch the
  # unambiguous non-create cases by message-regex and re-route to the
  # right intent. Equivalent of the post-classifier elif-chain that
  # used to live in llm_service.py:_intent_disambiguation.
  # ──────────────────────────────────────────────────────────────

  # ── R-3: Materialzusammenstellung → INT-W-10 ────────────────────
  # Welle C Sprint 3 (2026-05-15): GELÖSCHT. Diese Rule wurde durch das
  # Item ``lookup_intent_recheck_anchors__w10_compilation`` ersetzt
  # (steht in der Lookup-Group unten, VOR w11_create). Logik identisch,
  # aber zentraler verwaltet — alle Intent-Disambiguation an einem Ort.

  # ── R-3-Umrouting: INT-W-11 → andere Intents (Lookup-Group) ────
  # Welle C.1 (2026-05): Die 6 Einzel-Regeln (rule_intent_w11_to_w05/w07/
  # w08/w09/w06/w02) sind in den Lookup-Block ``lookup_intent_w11_target``
  # am Ende dieser Datei zusammengefasst. Logik identisch — der LLM-
  # Classifier wählt regelmäßig INT-W-11 (Erstellen), sobald ein Material-
  # typ-Wort fällt, auch wenn der eigentliche Intent etwas anderes ist
  # (Redaktion / Download / Eval / Reporting / Fakten / Orientierung).
  # Die Regex-Tabelle korrigiert das pre-Pattern-Selection.

  # ── R-3b: state-12-Lernpfad-Compilation-Fix ─────────────────────
  # Welle C Sprint 3 (2026-05-15): GELÖSCHT. Diese Rule war SHADOW und
  # setzte state-5 bei state-12 + INT-W-11 + Material-Zusammenstellungs-
  # Regex. Sie war redundant zu rule_state12_guard (LIVE), die state-5
  # für jeden non-canvas-intent in state-12 setzt — UND zu rule_lp_-
  # compilation (LIVE), die INT-W-11 → INT-W-10 routet (was state-12
  # automatisch nicht mehr legitim macht). Doppelte Sicherheit ohne
  # zusätzlichen Effekt → entfernt.

  # ── R-4: state-12 guard for non-canvas intents ──────────────────
  # state-12 (Canvas-Arbeit) ist nur legitim wenn der User wirklich am
  # Canvas arbeitet (INT-W-11 Create oder INT-W-12 Edit). Bei anderen
  # Intents (Statistiken-Frage, Search, Feedback) muss der State auf
  # state-5 fallen, sonst werden falsche Pattern wie PAT-21 selektiert.
  # Markdown-Check entfällt: auch mit existierendem Canvas-Markdown
  # gilt: andere Intents → andere Patterns.
  - id: rule_state12_guard
    description: "state-12 only valid for INT-W-11/INT-W-12 (canvas-create/edit)."
    priority: 70
    live: true
    when:
      all:
        - state: { eq: "state-12" }
        - intent: { not_in: ["INT-W-11", "INT-W-12"] }
    then:
      state_override: "state-5"

  # ── R-5: soft-create override (material_typ + create-verb) ─────
  # Wenn der Classifier ein Such-Intent erkannt hat (INT-W-03b), aber
  # Material-Typ und ein klares Create-Verb auftauchen, korrigiert die
  # Engine zu INT-W-11 + state-12. Die `not_in`-Liste schützt explizite
  # Non-Create-Intents (Routing/Download/Eval/Stats/Feedback/Soft-Probing/
  # WLO-kennenlernen/Lernpfad/Faktenfragen) vor dem Override.
  - id: rule_soft_create
    description: "Material-Typ + Create-Verb → INT-W-11 (+ state-12)."
    priority: 60
    live: true
    when:
      all:
        - entity.material_typ: { non_empty: true }
        - intent:
            not_in: ["INT-W-01", "INT-W-02", "INT-W-04",
                     "INT-W-05", "INT-W-06", "INT-W-08",
                     "INT-W-09", "INT-W-10", "INT-W-11", "INT-W-12"]
        - message:
            regex: "\\b(erstell|mach\\s+mir|generier|baue|bau\\s+mir|entwickle|schreib\\s+mir|formulier)"
    then:
      intent_override: "INT-W-11"
      state_override: "state-12"

  # ── R-6: vague search without topic → orientation ──────────────
  # Excludes meta-questions ("wie funktioniert", "schritt für schritt")
  # which should NOT be re-routed to orientation — they're how-to asks.
  # ── R-6d: Filter-Refinement → PAT-07 (Ergebnis-Kuratierung) ────
  # Welle C Sprint 6 Hotfix: Wenn der User in einem Folge-Turn die Suche
  # eingrenzt (z.B. "nur Videos zeigen", "nur Sek I"), darf er NICHT auf
  # PAT-06 (Degradation-Brücke) zurückfallen — das fühlt sich wie ein
  # Bug an ("Ich finde nichts" obwohl der User nur einen Filter setzt).
  # Stattdessen: PAT-07 mit dem alten thema-Kontext + neuem medientyp-
  # Filter. Greift nur bei follow_up mit nicht-leerem thema (sonst wäre
  # es kein Refinement).
  #
  # Voraussetzung: PAT-07.gate_personas enthält die User-Persona (wurde
  # in Sprint 6 auf P-AND/ELT/VER erweitert, damit der Refinement-Pfad
  # für alle Personas funktioniert).
  - id: rule_filter_refinement_to_curation
    description: "follow_up mit medientyp-Wunsch + thema gesetzt → PAT-07 (Ergebnis-Kuratierung)."
    priority: 60
    live: true
    when:
      all:
        - intent: { in: ["INT-W-03"] }
        - turn_type: { eq: "follow_up" }
        - entity.medientyp: { non_empty: true }
        - entity.thema: { non_empty: true }
    then:
      enforced_pattern_id: "PAT-07"

  # ── R-6e: Canvas-Create ohne Thema → Klärung statt blinde Erzeugung ──
  # Welle C Sprint 6 Hotfix (Eval-Befund eval-3799fcfd):
  # Wenn der Classifier INT-W-11 (Inhalt erstellen) erkennt, aber weder
  # ein ``thema`` noch ein ``material_typ`` extrahiert wurde, fällt
  # PAT-21 (Canvas-Create) in Phase 1 schon durch (precondition_slots
  # = [thema, material_typ]). Ohne diese Rule würde PAT-01 (Direkt-
  # Antwort) oder PAT-06 (Degradation-Brücke) übernehmen — beide
  # liefern keine saubere Slot-Klärung.
  #
  # Bewusste Designentscheidung gegen "PAT-01 sperren":
  #   - PAT-01 generell zu sperren wäre destruktiv (Edge-Cases mit
  #     Kontext-Slots im Session-State würden brechen).
  #   - PAT-02 (Geführte Klärung) ist semantisch passender als PAT-20
  #     (Orientierungs-Guide): PAT-02 stellt EINE klare Frage, PAT-20
  #     zeigt Plattform-Optionen. Bei "Erstelle mir ein Arbeitsblatt
  #     (ohne Thema)" ist die Slot-Frage "Zu welchem Thema?" die
  #     erwartete Antwort, nicht ein Plattform-Rundgang.
  - id: rule_canvas_create_needs_thema
    description: "INT-W-11 ohne thema → PAT-02 (Slot-Klärung). thema ist der kritische Slot — ohne Thema kein Material."
    priority: 56
    live: true
    when:
      all:
        - intent: { in: ["INT-W-11"] }
        - entity.thema: { empty: true }
    then:
      enforced_pattern_id: "PAT-02"
      quick_replies:
        - "Zum Thema Bruchrechnung"
        - "Zum Thema Photosynthese"
        - "Anderes Thema nennen"
        - "Anderes Material wählen"

  # ── R-6c: Topic-Switch ohne neues Thema → Klärung erzwingen ────
  # Welle C Sprint 6: Wenn der Classifier ``turn_type = "topic_switch"``
  # erkennt (z.B. "ein anderes thema bitte"), aber im NEUEN Turn weder
  # ein konkretes Thema noch ein Fach genannt wurde, darf der Bot NICHT
  # blind die Suche zum alten Thema wiederholen. Stattdessen erzwingen
  # wir PAT-02 (Geführte Klärung) — der fragt aktiv: "Zu welchem Thema?".
  #
  # Diese Rule muss VOR ``rule_vague_search`` (Priority 50) feuern,
  # damit nicht der breite PAT-20-Fallback greift bevor die spezifische
  # topic_switch-Logik anspringt. Priority 55 reicht.
  - id: rule_topic_switch_needs_clarification
    description: "topic_switch + leeres thema/fach → PAT-02 (klären) statt blind altes Thema weiterzunutzen."
    priority: 55
    live: true
    when:
      all:
        - turn_type: { eq: "topic_switch" }
        - entity.thema: { empty: true }
        - entity.fach: { empty: true }
        - intent: { in: ["INT-W-03", "INT-W-10", "INT-W-11"] }
    then:
      enforced_pattern_id: "PAT-02"
      quick_replies:
        - "Anderes Fach (Mathe, Bio, Deutsch, ...)"
        - "Anderes Thema (frei eingeben)"
        - "Zurück zum vorigen Thema"

  - id: rule_vague_search
    description: "Search-intent OHNE jeglichen Anker (kein thema, kein fach, keine stufe, kein medientyp) → PAT-20 (Orientierungs-Guide)."
    priority: 50
    live: true
    # Erweitert 2026-04-27: bei echter Such-Anfrage mit FACH oder STUFE
    # oder MEDIENTYP existiert ein Suchanker → richtiges Pattern wählt
    # die Engine selbst (PAT-04 Inspiration / PAT-07 Curation / PAT-18
    # Unterrichts-Paket etc.). PAT-20 nur wenn JEDER Slot leer ist und
    # die Anfrage nicht nach How-To klingt.
    when:
      all:
        - intent: { in: ["INT-W-03"] }
        - entity.thema: { empty: true }
        - entity.fach: { empty: true }
        - entity.stufe: { empty: true }
        - entity.medientyp: { empty: true }
        - not:
            message:
              regex: "(wie\\s+(geht|funktioniert|finde|nutze|benutze)|erklär|schritt\\s+für\\s+schritt|anleitung|tutorial|was\\s+(kann|gibt))"
    then:
      enforced_pattern_id: "PAT-20"

  # ── Persona Self-ID Overrides (R-PSI-1 bis R-PSI-8) ────────────
  # Explizite Selbstidentifikation (z.B. "ich bin Lehrerin", "als Redakteur",
  # "für unsere Verwaltung") überschreibt die LLM-Persona-Wahl deterministisch.
  # Höhere Priorität als low-confidence-fallback (R-6b @ 96), damit Self-ID
  # auch bei niedrig-confidence-Klassifikationen greift.

  # ── R-PSI: Persona-Self-Identification (Lookup-Group) ──────────
  # Welle C.1 (2026-05): Die 8 Einzel-Regeln (rule_persona_self_id_lk
  # bis _ver) wurden in EINEN Lookup-Block am Ende dieser Datei zusam-
  # mengeführt. Funktional identisch — die Studio-pflegbare Tabelle
  # ist übersichtlicher als 8 fast identische Rule-Definitionen.
  # Siehe ``lookups:`` weiter unten (id_prefix: lookup_persona_self_id).

  # ── R-6b: Niedrige Persona-Confidence → P-AND ──────────────────
  # Wenn der Classifier sich bei der Persona unsicher ist (<0.40),
  # lieber P-AND stehen lassen als eine falsche spezifische Persona
  # zu wählen, die Tonalität und Pattern in falsche Richtung zieht.
  # Threshold ist eng (0.40 statt z.B. 0.55), weil wir zuvor festgestellt
  # haben dass aggressive Schwellen den Score regrieren.
  - id: rule_low_persona_confidence
    description: "persona_confidence < 0.40 → P-AND (vermeidet Falsch-Persona)."
    priority: 96
    live: true
    when:
      persona_confidence: { lt: 0.40 }
    then:
      persona_override: "P-AND"

  # ── R-7: Niedrige Intent-Confidence → Klärung ──────────────────
  # Wenn der Classifier selbst unsicher war, ist eine Rückfrage besser
  # als eine fehlerhafte Pattern-Auswahl. Schwelle 0.55 ist konservativ —
  # nur die wirklich unsicheren Klassifikationen.
  - id: rule_low_intent_confidence
    description: "Classifier intent_confidence < 0.55 → PAT-02 (Klärung)."
    priority: 95
    live: true
    when:
      intent_confidence: { lt: 0.55 }
    then:
      enforced_pattern_id: "PAT-02"

  # ── R-8: Tight-Race PAT-01 vs PAT-02 — NUR bei Such-Intent ohne Thema ──
  # Frühere Version war zu aggressiv: hat auch konversationelle Intents
  # (INT-W-01 WLO kennenlernen, INT-W-02 Soft-Probing, INT-W-04 Feedback)
  # zu PAT-02 umgeleitet, obwohl PAT-01 dort die richtige Antwort wäre.
  # Jetzt: nur bei Such-Intents UND wenn thema fehlt (also wirklich
  # unklarer Anfrage).
  - id: rule_tiebreak_pat01_vs_pat02
    description: "PAT-01 vs PAT-02 tight race bei thema-loser Suche → PAT-02."
    priority: 40
    # SHADOW only — rule_vague_search (R-6) catches the same cases first
    # with higher priority, so this would only fire if R-6 didn't.
    # Eval-Run 5 confirmed: 0 fires after R-6 was tightened. Kept in
    # shadow as a safety net should R-6 ever be disabled.
    live: false
    when:
      all:
        - intent: { in: ["INT-W-03", "INT-W-10", "INT-W-11"] }
        - entity.thema: { empty: true }
        - pattern_score_gap: { lt: 0.05 }
        - any:
            - all:
                - pattern_winner: { eq: "PAT-01" }
                - pattern_runner_up: { eq: "PAT-02" }
            - all:
                - pattern_winner: { eq: "PAT-02" }
                - pattern_runner_up: { eq: "PAT-01" }
    then:
      enforced_pattern_id: "PAT-02"

  # ── R-9: INT-W-09 Reporting nur für P-VER zu PAT-03 ────────────
  # Eval-Befund: INT-W-09 mit PAT-03 hilft P-VER (Verwaltung erwartet
  # ehrliche "Daten nicht verfügbar"-Aussage), schadet aber Schüler:innen
  # und Redaktion (die wollen lieber konkrete Inhalte/Lernmaterial).
  # → Scope auf P-VER + analytische Personas einschränken.
  - id: rule_tiebreak_int_w_09
    description: "P-VER/P-W-POL/P-W-PRESSE bei INT-W-09 + tight race → PAT-03."
    priority: 45
    live: true
    when:
      all:
        - intent: { eq: "INT-W-09" }
        - persona: { in: ["P-VER", "P-W-POL", "P-W-PRESSE", "P-BER"] }
        - pattern_score_gap: { lt: 0.05 }
        - pattern_winner: { in: ["PAT-10", "PAT-01"] }
    then:
      enforced_pattern_id: "PAT-03"

  # ── R-10: Tight-Race PAT-02 vs PAT-06 bei state-12 → PAT-19 ───
  # In state-12 mit INT-W-10 und knappem Score (typisch:
  # "Materialien für Unterrichtseinheit") sollte der Lernpfad-Pattern
  # PAT-19 greifen, nicht die generische Bridge.
  - id: rule_tiebreak_lp_in_state12
    description: "Unterrichtsplanung (P-W-LK + INT-W-10 + Thema) → PAT-19 dominant."
    priority: 50
    # Welle C Sprint 5 (2026-05-15): AUF SHADOW gesetzt — Eval-Stats
    # zeigten konstant 0% held (3 fired, 0 davon final-relevant). Die
    # Rule feuerte, aber spätere Pipeline-Stufen oder höher-priorisierte
    # Rules (z.B. lookup_intent_forces_pattern__*) überstimmen sie
    # konsequent. PAT-19's Gate-Logik wählt das Pattern bereits gut, ohne
    # diesen Tiebreaker. SHADOW belässt die Telemetrie für späteres
    # Re-Aktivieren, ohne aktiv Konflikte zu produzieren.
    # ACTIVATED 2026-04-26: Smoke zeigte mehrere Probleme:
    # 1) Free-text-Signal-Fluktuation lässt PAT-19's Score zwischen
    #    0.604 und 0.679 schwanken — PAT-06 (prio 595, score ~0.615)
    #    gewinnt knapp wenn "zielgerichtet" nicht in den Signals ist.
    # 2) Classifier setzt für "Lernpfad fuer Klasse 8" manchmal state-8
    #    (Learning) statt state-12/state-5 — PAT-19's Gate kennt
    #    state-8 nicht, also wird PAT-19 in phase1 eliminiert.
    # Lösung: harte Promotion ohne State-Gate. select_pattern's
    # enforced-pattern-Pfad umgeht phase1_gate ohnehin, also kein Risk
    # einer "PAT-19 ohne Gate-Match"-Inkonsistenz.
    live: false
    when:
      all:
        - persona: { eq: "P-W-LK" }
        - intent: { eq: "INT-W-10" }
        - entity.thema: { non_empty: true }
        - pattern_winner: { not_in: ["PAT-19", "PAT-21", "PAT-CRISIS", "PAT-REFUSE-THREAT"] }
    then:
      enforced_pattern_id: "PAT-19"

  # ── R-11: Tight-Race PAT-25 vs PAT-06 bei INT-W-12 → PAT-25 ───
  # Canvas-Edit-Intent gewinnt immer, wenn er sauber klassifiziert wurde.
  - id: rule_tiebreak_canvas_edit
    description: "INT-W-12 dominant → immer PAT-25, nie PAT-06."
    priority: 50
    live: true
    when:
      all:
        - intent: { eq: "INT-W-12" }
        - pattern_winner: { eq: "PAT-06" }
    then:
      enforced_pattern_id: "PAT-25"

  # ── R-12: Schüler + "Schritt für Schritt" → PAT-14 ─────────────
  # Tight-Race PAT-06 vs PAT-14 (frühere Bezeichnung PAT-13 — Welle B.2
  # 2026-05 hat PAT-13 in PAT-14 gemergt, weil beide auf Lerner/Eltern
  # gerichtet waren). PAT-14 (Lerner-Empfehlung, Modus "schrittweise")
  # ist didaktisch besser für Schüler/Eltern, wenn die Anfrage explizit
  # nach Anleitung ruft.
  - id: rule_tiebreak_schritt_fuer_schritt
    description: "P-W-SL/P-ELT mit 'Schritt für Schritt' → PAT-14."
    priority: 50
    live: true
    when:
      all:
        - persona: { in: ["P-W-SL", "P-ELT"] }
        - any:
            - message: { regex: "schritt\\s+für\\s+schritt" }
            - message: { regex: "erkl[äa]r\\s+mir" }
            - message: { regex: "verstehe\\s+(das|es)\\s+nicht" }
        - pattern_score_gap: { lt: 0.05 }
        - pattern_winner: { eq: "PAT-06" }
        - pattern_runner_up: { eq: "PAT-14" }
    then:
      enforced_pattern_id: "PAT-14"

  # ── R-13: INT-W-11 mit material_typ + thema → PAT-21 dominant ──
  # Wenn der Classifier INT-W-11 setzt (Inhalt erstellen) UND
  # material_typ + thema bekannt sind, MUSS PAT-21 gewinnen. PAT-06
  # (Degradation) ist hier eindeutig falsch. Der frühere Tight-Race-
  # Schutz war zu eng (forderte runner_up=PAT-21), schlug aber fehl
  # wenn andere Patterns (PAT-18 etc.) auf Platz 2 lagen — Smoke vom
  # 2026-04-26 zeigte: PAT-06 0.6135, PAT-18 0.601, PAT-21 0.601 →
  # runner_up war PAT-18, R-13 feuerte nicht. Jetzt: harte Promotion
  # bei vollen Slots, unabhängig vom Runner-Up.
  - id: rule_tiebreak_create_intent
    description: "INT-W-11 mit material_typ + thema → PAT-21 dominant."
    priority: 50
    live: true
    when:
      all:
        - intent: { eq: "INT-W-11" }
        - entity.thema: { non_empty: true }
        - entity.material_typ: { non_empty: true }
        - pattern_winner: { in: ["PAT-06", "PAT-18", "PAT-01", "PAT-02"] }
    then:
      enforced_pattern_id: "PAT-21"

  # ── R-INT-W-* Intent-Force-Pattern (Lookup-Group) ──────────────
  # Welle C.1 (2026-05): Die 4 Einzel-Regeln (rule_int_w_05/04/07/08_
  # forces_pat*) sind in den Lookup-Block ``lookup_intent_forces_pattern``
  # am Ende dieser Datei zusammengeführt. Intent-spezifische Patterns
  # sollen für ihren Intent immer gewinnen, auch wenn z.B. PAT-02 durch
  # Signal-Bonus knapp führt.

  # ── R-INT-W-09 Halluzination-Schutz ────────────────────────────
  # Bei INT-W-09 (Reporting) mit themen, die KLAR nicht WLO/OER-Bereich
  # sind (Pressestatistiken, Arbeitslosigkeit, Wahlumfragen, Bezirks-
  # daten zu unspezifischen Themen), darf der Bot nicht WLO-Statistiken
  # als Ersatz präsentieren. PAT-03 (Transparenz) zwingt den Bot zur
  # ehrlichen "habe ich nicht"-Antwort.
  - id: rule_int_w_09_external_topic_to_pat03
    description: "INT-W-09 zu nicht-WLO-Thema (Presse/Politik/Bezirk) → PAT-03."
    priority: 58
    live: true
    when:
      all:
        - intent: { eq: "INT-W-09" }
        - message:
            regex: "\\b(arbeitslosigkeit|wahlumfrage|wahlergebnis|presseberichterstattung|leserzahl(en)?|reichweiten?|verkaufszahl(en)?|nutzerzahl(en)?\\s+(von|der)\\s+(?!wlo|wirlernenonline|oer|edu-sharing)|bezirksauswertung|behoerden(daten|statistik))\\b"
    then:
      enforced_pattern_id: "PAT-03"

  # ── R-PAT-05-LK: Profi-Filter für Lehrkräfte bei Tight Race ────
  # Bei P-W-LK + INT-W-10 + state-12 + Tight Race PAT-02 vs PAT-05:
  # Lehrkräfte profitieren mehr von einem Profi-Filter (PAT-05) als
  # von Klärung (PAT-02), weil sie Fach-Wissen mitbringen.
  - id: rule_pat05_for_lk_in_state12
    description: "P-W-LK + INT-W-10 + state-12 + tight race → PAT-05."
    priority: 50
    live: true
    when:
      all:
        - persona: { eq: "P-W-LK" }
        - intent: { eq: "INT-W-10" }
        - state: { eq: "state-12" }
        - pattern_score_gap: { lt: 0.05 }
        - any:
            - all:
                - pattern_winner: { eq: "PAT-02" }
                - pattern_runner_up: { eq: "PAT-05" }
            - all:
                - pattern_winner: { eq: "PAT-05" }
                - pattern_runner_up: { eq: "PAT-02" }
    then:
      enforced_pattern_id: "PAT-05"

  # ── R-15: PAT-09 dominant für Recherche-Personas mit Thema ─────
  # Wenn die Persona klar im Recherche-Kontext steht (Redaktion, Presse,
  # Politik, Beratung) und ein Thema vorliegt, ist PAT-09 die korrekte
  # Pattern-Wahl — auch wenn PAT-06 (Degradation) durch Score-Fluktuation
  # knapp führt. Smoke vom 2026-04-26: P-W-RED + INT-W-03b + thema
  # "Klimawandel" → PAT-06 0.59 vs PAT-09 0.53 (PAT-09 verliert wegen
  # fehlendem Signal-Match, obwohl es strukturell die einzig richtige
  # Antwort ist). Gates: PAT-09 fordert intent ∈ {INT-W-01, INT-W-03a/b/c,
  # INT-W-05, INT-W-06, INT-W-08, INT-W-09, INT-W-10}.
  - id: rule_recherche_personas_force_pat09
    description: "Recherche-Personas (RED/PRESSE/POL/BER) + Thema + passender Intent → PAT-09."
    priority: 55
    live: true
    when:
      all:
        - persona: { in: ["P-W-RED", "P-W-PRESSE", "P-W-POL", "P-BER"] }
        - intent:
            in: ["INT-W-01", "INT-W-03",
                 "INT-W-05", "INT-W-06", "INT-W-08", "INT-W-09", "INT-W-10"]
        - entity.thema: { non_empty: true }
        - pattern_winner: { in: ["PAT-06", "PAT-01", "PAT-02", "PAT-10"] }
    then:
      enforced_pattern_id: "PAT-09"

  # ── R-14: Persönliche Daten-Anfragen → PAT-03 (Transparenz) ────
  # "Noten meiner Klasse", "Stunden mein Sohn", "meine Leistungen",
  # "unsere Prüfungen" — der Bot HAT solche personen-/klassenspezifischen
  # Daten nicht. Statt fake-Statistiken (PAT-10) oder generische
  # Lehrplan-Vorlagen (PAT-15) lieber ehrlich sagen "kann ich nicht".
  # Gilt für alle Personas, nicht nur P-VER (im Gegensatz zu R-9).
  - id: rule_personal_data_request
    description: "Pers. Datenfragen (mein Sohn, meine Klasse, …) → PAT-03."
    priority: 60
    live: true
    when:
      all:
        - intent: { in: ["INT-W-06", "INT-W-08", "INT-W-09"] }
        - message: { regex: "\\b((mein|meine[rn]?|unser|unsere[rn]?)\\s+(klasse|kurses?|schülerinnen|sch[üu]ler|kindes?|sohn(es?)?|tochter|gruppe|projekt[es]?)|f[üu]r\\s+(mein|meine[rn]?|unser|unsere[rn]?)\\s+(klasse|kurses?|sch[üu]ler|kindes?|sohn|tochter|kind)|wie\\s+(viele|lange|oft)\\s+\\w+\\s+(mein|meine|unser|unsere))\\b" }
    then:
      enforced_pattern_id: "PAT-03"

  # ── R-15: Fachportal-Übersicht → PAT-26 ────────────────────────
  # User fragt explizit nach "alle Fächer", "Fachportale", "welche
  # Disziplinen" — soll deterministisch zu PAT-26 (Übersicht via
  # get_subject_portals) gehen, NICHT zu PAT-20 (textuelle Erklärung)
  # oder zu search_wlo_collections (das liefert Sub-Sammlungen, nicht
  # Top-Level-Portale).
  #
  # Regex deckt drei Schreibweisen pro Umlaut ab: ä / ae / a (für User,
  # die ohne Umlaute tippen). "Fachportale" mit Plural-e.
  - id: rule_fachportal_overview
    description: "User fragt nach Fachportal-Übersicht → INT-W-13 + PAT-26."
    priority: 65
    live: true
    when:
      all:
        - message:
            regex: "\\b(alle\\s+f(ä|ae|a)cher|welche\\s+f(ä|ae|a)cher|f(ä|ae|a)chportal\\w*|alle\\s+(disziplinen|portale)|portal(ü|ue|u)bersicht|f(ä|ae|a)cher(ü|ue|u)bersicht|was\\s+bietet\\s+wlo\\s+f(ü|ue|u)r\\s+f(ä|ae|a)cher|in\\s+welchen\\s+f(ä|ae|a)chern|alle\\s+schulf(ä|ae|a)cher)\\b"
        - entity.thema: { empty: true }   # nur OHNE konkretes Thema
    then:
      intent_override: "INT-W-13"
      enforced_pattern_id: "PAT-26"

  # ── R-16: Themen-Drilldown → PAT-27 ────────────────────────────
  # User fragt explizit nach Sub-Themen / Bereiche / Unterthemen einer
  # bekannten Sammlung — soll PAT-27 (browse_collection_tree) ansteuern,
  # nicht PAT-04 (allgemeine Suche).
  #
  # Bewusst KEINE entity-Bedingung: die Regel läuft in der Pre-Phase,
  # da sind entities noch nicht extrahiert. Die Regex selbst ist
  # spezifisch genug ("welche themen unter X", "wie ist X gegliedert"),
  # dass falsch-positive Matches selten sind.
  - id: rule_themen_drilldown
    description: "User fragt nach Sub-Themen einer Sammlung → INT-W-14 + PAT-27."
    priority: 64
    live: true
    when:
      message:
        regex: "\\b(welche\\s+(themen|bereiche|unterthemen|teilbereiche|kapitel)|gliedere|wie\\s+ist\\s+\\w+\\s+(unterteilt|strukturiert|aufgeteilt|gegliedert)|wie\\s+(ist|wird)\\s+\\w+\\s+(gegliedert|aufgebaut)|unterthemen\\s+von|bereiche\\s+(unter|in|von)|sub-?sammlungen)\\b"
    then:
      intent_override: "INT-W-14"
      enforced_pattern_id: "PAT-27"

  # ── R-17: Themenseiten-Suche → PAT-28 ──────────────────────────
  # User fragt explizit nach EINER Themenseite/Sammlung zu einem
  # konkreten Fach oder Thema (Singular). Soll deterministisch zu
  # PAT-28 (search_wlo_topic_pages) gehen, NICHT zu PAT-06 (Degradation),
  # PAT-20 (textuelle Orientierung) oder PAT-26 (alle Fachportale).
  #
  # Regex-Logik (DE-tolerant):
  #   themenseite|hauptseite|sammlung|übersicht|bereich|fachseite
  #   + ZU/FÜR/ÜBER/VON [Wort]
  # Plus "wo finde ich [die|eine] (themenseite|sammlung)" als Variante.
  # Trigger NUR wenn ein Substantiv-Komplement folgt — leere Frage
  # "themenseite?" geht weiter den Default-Weg (typischerweise INT-W-06).
  - id: rule_themenseite_search
    description: "User sucht eine konkrete Themenseite zu X → INT-W-03 + PAT-28."
    priority: 64
    live: true
    when:
      message:
        regex: "\\b((themen|haupt|fach)seite|sammlung|(ü|ue|u)bersicht|bereich)\\s+(zu(m|r)?|f(ü|ue|u)r|(ü|ue|u)ber|von)\\s+\\w+|\\b(ich\\s+such(e|t)|wo\\s+(finde|gibt[s]?)\\s+(ich\\s+)?(es|der|die|das|den|eine?))\\s+(die|eine)?\\s*(themen|haupt|fach)seite\\s+(zu|f(ü|ue|u)r|(ü|ue|u)ber|von)\\s+\\w+"
    # Welle C Sprint 4 (2026-05-15): rule_int_w03a_to_pat28 wurde
    # gelöscht (INT-W-03a existiert nicht mehr — Merge in INT-W-03).
    # Jetzt setzt diese Rule BEIDES — Intent + Pattern — atomar:
    # die Themenseiten-Erkennung führt deterministisch zu PAT-28.
    then:
      intent_override: "INT-W-03"
      enforced_pattern_id: "PAT-28"

  # ── R-18: GELÖSCHT (Welle C Sprint 4) ──────────────────────────
  # ``rule_int_w03a_to_pat28`` wurde entfernt — INT-W-03a existiert
  # nicht mehr (Merge mit 03b/03c → INT-W-03). Pattern-Force PAT-28
  # kommt jetzt direkt aus rule_themenseite_search (oben).

  # ── R-19: Verstehen-Defizit + Schritt-für-Schritt → INT-W-03c ──
  # Eval 2026-05-03 zeigte: "Ich verstehe Mathe nicht, kannst du mir das
  # Schritt für Schritt erklären?" wurde als INT-W-06 (Faktenfragen)
  # klassifiziert, sollte aber INT-W-03c (Lerninhalt suchen) sein.
  # Der Classifier-Prompt mit Doppel-Trigger-Regel reicht alleine nicht
  # zuverlässig — daher hartes Override per Regex.
  #
  # Trigger: ein Verstehen-Defizit-Verb (verstehe/check/kapiere/raffe …
  # nicht / kommt nicht an / ist mir unklar) PLUS irgendein Lern-/Erklär-
  # Format-Hinweis (Schritt für Schritt, einfach erklärt, mit Beispielen,
  # mit Beispiel, so dass ich es verstehe, nochmal erklären, langsam
  # erklären). Beide Cluster zusammen sind eindeutig INT-W-03c.
  - id: rule_lerninhalt_doppel_trigger
    description: "Defizit-Verb + Lernformat-Phrase → INT-W-03 + PAT-14 (Lerner-Empfehlung)."
    priority: 64
    live: true
    when:
      all:
        - message:
            regex: "\\b(verstehe|check|kapier(e)?|raff(e)?|begreif(e)?|peil(e)?)[\\s\\w,.]{0,40}\\bnicht\\b|\\b(ist|sind)[\\s\\w]{0,15}\\bunklar\\b|\\bkomm(e|t)\\b[\\s\\w]{0,15}\\bnicht\\s+(an|drauf|mit)\\b"
        - message:
            regex: "\\bschritt\\s+f(ü|ue|u)r\\s+schritt\\b|\\beinfach\\s+(erkl(ä|ae)rt|erkl(ä|ae)ren)\\b|\\bso\\s+dass\\s+ich\\s+(es|das)\\s+verstehe\\b|\\bmit\\s+beispiel(en)?\\b|\\bnochmal\\s+erkl(ä|ae)ren\\b|\\blangsam(er)?\\s+erkl(ä|ae)ren\\b|\\bkannst\\s+du\\s+(mir\\s+)?(das|es)\\s+erkl(ä|ae)ren\\b"
    # Welle C Sprint 4 (2026-05-15): Setzt jetzt BEIDES atomar —
    # Intent INT-W-03 + Pattern PAT-14 (Lerner-Empfehlung, früher
    # Schritt-für-Schritt-Modus). Verhindert dass nach INT-W-03c-
    # Wegfall ein anderes Pattern (PAT-07 / PAT-05) gewählt wird.
    then:
      intent_override: "INT-W-03"
      enforced_pattern_id: "PAT-14"

# ══════════════════════════════════════════════════════════════════════
# Lookup-Groups — Welle C.1 (2026-05)
# ══════════════════════════════════════════════════════════════════════
#
# Strukturell identische Rule-Gruppen werden hier als Lookup-Tabellen
# definiert. Der Rule-Engine-Loader (``rule_engine.py:_expand_lookup_group``)
# expandiert sie zur Lade-Zeit in einzelne RuleDefs — semantisch identisch
# zu manuell geschriebenen Rules, aber Studio-pflegbar als Tabelle.
#
# Schema:
#   id_prefix    : Präfix für generierte Rule-IDs (z.B. ``lookup_x__lk``)
#   when_path    : Context-Pfad für die Match-Bedingung (z.B. ``message``)
#   when_op      : Match-Operator (regex | eq | in | contains | non_empty)
#   then_field   : Effekt-Feld (z.B. ``persona_override``, ``intent_override``)
#   when_extra   : Zusätzliche when-Klauseln (AND-kombiniert mit der Match)
#   then_extra   : Zusätzliche then-Felder (konstant über alle items)
#   items        : Liste {key, match, value} — eine Rule pro Item.
#
# Pflege im Studio: die Lookup-Tabellen können als Datentabelle gerendert
# werden (1 Spalte key, 1 Spalte match, 1 Spalte value). Das ersetzt
# fast-identische YAML-Blöcke (8× R-PSI, 5× R-IFA, 7× R-3-INT-W-11).

lookups:
  # ── Persona-Self-Identification (ersetzt R-PSI-1..R-PSI-8) ─────
  # Trigger: User sagt explizit "ich bin Lehrer / mein Kind / als
  # Berater" etc. → Persona wird hart überschrieben, bevor das
  # Pattern gewählt wird.
  - id_prefix: lookup_persona_self_id
    description: "Persona-Self-ID aus expliziten Sprachhinweisen."
    priority: 100
    live: true
    when_path: message
    when_op: regex
    then_field: persona_override
    items:
      - key: lk
        match: "\\b(ich\\s+bin\\s+(lehr(er|erin|kraft)|p[äa]dagog(in|e)?|klassenlehr(er|erin)|grundschullehr(er|erin)|fachlehr(er|erin)|referendar(in)?)|als\\s+(lehrkraft|lehrer(in)?|p[äa]dagog(in|e)?|fachlehr(er|erin)|referendar(in)?)|f[üu]r\\s+meinen\\s+unterricht|in\\s+meiner\\s+klasse\\s+unterrichte|meine\\s+sch[üu]ler:?innen|mein\\s+stundenentwurf|meinen\\s+stundenentwurf|meine\\s+(unterrichts(stunde|einheit|reihe)|lehrplan)|meinen\\s+(unterrichts(stunde|einheit|reihe)|lehrplan)|(klassenarbeit(en)?\\s+(korrigier|bewerten|stell)|korrigier(e|en)\\s+klassenarbeit(en)?|klausur(en)?\\s+(korrigier|bewerten|stell)|korrigier(e|en)\\s+klausur(en)?)|meinen?\\s+lehrplan|in\\s+meiner\\s+(unterrichts(stunde|einheit|reihe))|f[üu]r\\s+meinen\\s+lehrauftrag)\\b"
        value: "P-W-LK"
      - key: sl
        match: "\\b(ich\\s+bin\\s+sch[üu]ler(in)?|ich\\s+bin\\s+lernend(e|er)|als\\s+sch[üu]ler(in)?|f[üu]r\\s+meine\\s+(klassenarbeit|hausaufgabe|pr[üu]fung|klausur)|f[üu]r\\s+meinen\\s+(test|jahrgang)|ich\\s+lerne\\s+gerade\\s+(in\\s+der\\s+schule|f[üu]r\\s+die\\s+schule))\\b"
        value: "P-W-SL"
      - key: elt
        match: "\\b(ich\\s+bin\\s+(mutter|vater|elternteil|mama|papa)|als\\s+(mutter|vater|elternteil|mama|papa|eltern(teil)?)|mein\\s+(kind|sohn|tochter)|meine\\s+(tochter|kinder)|unser\\s+(kind|sohn|tochter)|unsere\\s+(tochter|kinder)|f[üu]r\\s+(meinen?|unseren?)\\s+(kind|sohn|tochter|\\d+\\s*-?\\s*j[äa]hrigen?)|hausaufgaben?\\s+(meines?|unseres?)\\s+(kind(es)?|sohn(es)?|tochter)|hausaufgabe\\s+von\\s+(meinem?|unserem?)\\s+(kind|sohn|tochter)|mutter\\s+von|vater\\s+von|elternteil\\s+von|elternabend|elternsprechtag|f[üu]r\\s+zu\\s+hause(\\s+lernen)?|zu\\s+hause\\s+(lernen|\\üben))\\b"
        value: "P-ELT"
      - key: red
        match: "\\b(ich\\s+bin\\s+(redakteur(in)?|autor(in)?)|als\\s+(redakteur(in)?|autor(in)?)|f[üu]r\\s+(unsere|meine)\\s+redaktion|kuratier\\w*|inhalte?\\s+einstellen|f[üu]r\\s+die\\s+sammlung\\s+pflegen|redaktionelle\\s+pflege|qualit(ä|ae)t(s)?pr(ü|ue)f)\\b"
        value: "P-W-RED"
      - key: pol
        match: "\\b(ich\\s+bin\\s+(politiker(in)?|abgeordnete[r]?|multiplikator(in)?)|als\\s+(politiker(in)?|abgeordnete[r]?|multiplikator(in)?)|f[üu]r\\s+(unsere|meine)\\s+(partei|fraktion)|f[üu]r\\s+(unser|das)\\s+ministerium|f[üu]r\\s+(meinen?\\s+)?(wahlkreis|antrag|positionspapier)|in\\s+meinem\\s+wahlkreis|in\\s+der\\s+(anh[öo]rung|gesetzgebung)|im\\s+(plenum|ausschuss)|positionspapier|bildungspolitisch\\w*|bildungspolitik|wahlkreis\\w*)\\b"
        value: "P-W-POL"
      # Welle C Sprint 2 (2026-05-15): Presse-Anker erweitert.
      # Eval zeigte "für meine Recherche" / "für meinen Artikel" /
      # "für meinen Beitrag" matched NICHT — Persona driftet zu P-AND.
      - key: presse
        match: "\\b(ich\\s+bin\\s+journalist(in)?|als\\s+journalist(in)?|ich\\s+arbeite\\s+als\\s+journalist|f[üu]r\\s+meine\\s+(presse|zeitung|redaktion\\s+der\\s+zeitung|recherche|leser:?innen)|f[üu]r\\s+(einen|meinen|den)\\s+(artikel|beitrag|bericht)|f[üu]r\\s+(eine|meine|die)\\s+(story|reportage|recherche)|presseanfrage|hintergrundrecherche|pressekit)\\b"
        value: "P-W-PRESSE"
      - key: ber
        match: "\\b(ich\\s+bin\\s+berater(in)?|als\\s+berater(in)?|f[üu]r\\s+(unsere|meine)\\s+beratung|in\\s+(unserem|meinem)\\s+beratungsprozess|f[üu]r\\s+unsere\\s+schule\\s+evaluier\\w*|vergleich\\s+(verschiedener|der)\\s+(angebote|plattform)\\w*)\\b"
        value: "P-BER"
      - key: ver
        match: "\\b(ich\\s+bin\\s+(verwaltungs|beh[öo]rden)|als\\s+verwaltungs|f[üu]r\\s+(unsere|die)\\s+(verwaltung|beh[öo]rde)|in\\s+der\\s+beh[öo]rdenarbeit|amtliche\\s+daten|kennzahlen\\s+f[üu]r\\s+das\\s+ministerium)\\b"
        value: "P-VER"

  # ── Intent-Recheck via Anker-Wörter (Welle C Sprint 3 — 2026-05-15) ──
  #
  # Konsolidierung: Vorher waren das ZWEI separate Lookups (für INT-W-02
  # und INT-W-11), die strukturell identisch waren. Eval-Run-Insight:
  # Der Classifier wählt **zu oft INT-W-02 (Erst-Orientierung) oder
  # INT-W-11 (Inhalt erstellen)** als Catch-all, sobald "ich bin neu" /
  # "kannst du mir erstellen" / "Arbeitsblatt"-Wörter im Text stehen —
  # auch wenn die Nachricht spezifischere Anker enthält.
  #
  # Diese Lookup-Tabelle korrigiert beide Catch-all-Intents in einem Schritt.
  # Reihenfolge: spezifische Verb-Anker (erstellen, downloaden, bewerten,
  # statistik, melden, feedback) ZUERST, dann Fachportal, Themenseite,
  # Selbst-Lernen, generisches Material, ganz am Ende Fakten-Frage.
  # First-write-wins bei gleicher Priorität.
  - id_prefix: lookup_intent_recheck_anchors
    description: "INT-W-02 / INT-W-11 werden korrigiert, sobald der User-Text einen spezifischeren Anker enthält."
    priority: 82
    live: true
    when_path: message
    when_op: regex
    then_field: intent_override
    when_extra:
      intent: { in: ["INT-W-02", "INT-W-11"] }
    items:
      # ---- Material-Compilation (Welle C Sprint 3): Unterrichtseinheit /
      #      Materialzusammenstellung — Mehrere Materialien zu einer Einheit
      #      bündeln ist INT-W-10 (Unterrichtsplanung), KEIN Einzel-Erstellen
      #      (INT-W-11). Steht VOR w11_create, weil "erstelle eine
      #      Materialzusammenstellung" sowohl "erstelle" als auch
      #      "zusammenstellung" matched.
      - key: w10_compilation
        match: "\\b(material(ien)?\\s*-?\\s*(zusammenstellung|sammlung|paket|set)|(mehrere|diverse|passende|strukturierte)\\s+material(ien)?|zusammenstellung\\s+(von|aus)\\s+material|material(ien)?\\s+(zusammen\\s*stellen|kompilieren|kuratieren)|unterrichts(einheit|plan|paket|baustein)|lerneinheit)\\b"
        value: "INT-W-10"
      # ---- Stark spezifische Verb-Anker zuerst ----
      - key: w11_create
        match: "\\b(erstell\\w*|generier\\w*|bau(e)?\\s+mir|mach(e|st)?\\s+mir|schreib(e|st)?\\s+mir|fertige\\s+(an|mir)|lass\\s+(dir)?\\s+(was|etwas)\\s+einfallen|infoblatt\\s+(zu|über|ueber)|factsheet\\s+(zu|über|ueber)|rede\\s+(zu|über|ueber))\\b"
        value: "INT-W-11"
      # Welle C Sprint 4: Download-Anker → INT-W-03 (Inhalte abrufen).
      # Vorher INT-W-07, aber technisch identisch: Bot sucht im Repo +
      # gibt User den Repo-Link (Download passiert beim User über die
      # Repo-Seite, nicht über den Bot).
      - key: w03_download
        match: "\\b(runterladen|herunterladen|als\\s+pdf|download(link)?|zum\\s+download|zum\\s+herunterladen|direkt\\s*-?\\s*(link|url)|zukommen\\s+lassen|zusenden|schicken|pressekit|bereitstellen|zur\\s+verf(ü|ue)gung\\s+stellen|gib\\s+mir\\s+(den|die|das)\\s+\\w+|wo\\s+(finde|kann|bekomme)\\s+ich)\\b"
        value: "INT-W-03"
      - key: w08_evaluate
        match: "\\b(ist\\s+(das|dieses|der|die)\\s+(\\w+\\s+){0,5}(gut|geeignet|brauchbar|passend|sinnvoll)|wie\\s+gut\\s+(ist|sind|eignet)\\s+(sich\\s+)?(das|dieses|der|die)|bewert(e|en|et)\\s+(das|dieses|f(ü|ue)r)|eignet\\s+sich\\s+\\w+\\s+f(ü|ue)r|qualit(ä|ae)t(s)?\\w*\\s+(von|der|des)|einsch(ä|ae)tzen|begutacht(e|en|et)|kannst\\s+du\\s+(mir\\s+)?(sagen|erkl(ä|ae)ren)\\s+ob)\\b"
        value: "INT-W-08"
      - key: w09_stats
        match: "\\b(statistik(en)?(\\s+(zu|ü|ueber))?|reichweite|nutzungs(zahlen|trend(s)?)|zahlen\\s+zu|daten\\s+zu|reporting|auswertung\\s+(von|der)|(ü|ue)bersicht\\s+(ü|ue)ber\\s+aktuelle|kpi|aggregat|jahresbericht|quartalsbericht|amtliche\\s+daten|wie\\s+viele\\s+\\w+\\s+(insgesamt|im\\s+quartal|im\\s+jahr|im\\s+letzten|wurden|gibt)|im\\s+letzten\\s+(quartal|jahr|halbjahr|monat)|anzahl\\s+(der|von|an)\\s+\\w+|aktuelle\\s+anzahl|gesamt-?zahl)\\b"
        value: "INT-W-09"
      - key: w05_redaktion
        match: "\\b(an\\s+(die\\s+)?redaktion|redaktion\\s+(melden|weiterleiten|schicken|senden|geben|schauen)|hinweis\\s+an\\s+(die\\s+)?redaktion|fehler\\s+gefunden|inhalt\\s+(falsch|fehlerhaft)|material\\s+hochladen|hochladen|upload(en)?|einreichen|einpflegen|einstellen|melden\\s+sollte|melden\\s+kann|was\\s+ich\\s+melden|anmerkungen\\s+(zu|hinterlassen|geben)|wo\\s+kann\\s+ich\\s+.{0,20}hinterlassen)\\b"
        value: "INT-W-05"
      - key: w04_feedback
        match: "\\b(das\\s+(war|ist|hat)\\s+(hilfreich|gut|schlecht|verwirrend|nicht\\s+klar|nicht\\s+geklappt|geholfen|geklappt)|tipps?\\s+(waren|fand|war)|du\\s+hast\\s+nicht\\s+verstanden|funktioniert\\s+nicht|verwirrend|schade\\s+dass)\\b"
        value: "INT-W-04"
      # ---- Fachportal-Plural-Frage (sehr spezifisch) ----
      - key: w13_subjects
        match: "\\b(alle\\s+f(ä|ae|a)cher|welche\\s+f(ä|ae|a)cher|f(ä|ae|a)chportal\\w*|alle\\s+schulf(ä|ae|a)cher|welche\\s+fachportale)\\b"
        value: "INT-W-13"
      # ---- Inhalte-Anker (gemerged Welle C Sprint 4): alle drei
      # Sub-Typen führen jetzt auf den einen INT-W-03. Die Pattern-
      # Wahl (PAT-28 / PAT-14 / PAT-07 / PAT-05 / PAT-09) entscheiden
      # dann die spezifischen rule_themenseite_search /
      # rule_lerninhalt_doppel_trigger oben + Persona/Signal in der
      # Pattern-Engine. ----
      - key: w03_topicpage
        match: "\\b(themen(seite|portale)|fachportal|hauptseite\\s+(zu|f(ü|ue)r)|sammlung\\s+(zu|f(ü|ue)r)|(ü|ue)bersicht\\s+(zu|f(ü|ue)r)|themen-?(ü|ue)bersicht|bereich\\s+(zu|f(ü|ue)r))\\b"
        value: "INT-W-03"
      - key: w03_selflearn
        match: "\\b(verstehe\\s+(das|es|ich)?\\s*nicht|kapier(e|t)?\\s+(das|es)?\\s*nicht|schritt\\s+f(ü|ue)r\\s+schritt|einfach\\s+erkl(ä|ae)rt|f(ü|ue)r\\s+meine?\\s+(hausaufgabe(n)?|klausur|pr(ü|ue)fung)|zum\\s+(verstehen|selbst-?lernen)|f(ü|ue)r\\s+mein\\s+kind\\s+(zum|beim)\\s+lernen)\\b"
        value: "INT-W-03"
      - key: w03_material
        match: "\\b(unterrichts(material|stunde|einheit|reihe)|arbeitsblatt|aufgabenblatt|quiz|video|interaktive(s)?\\s+(übung|uebung|aufgabe)|material(ien|s|e)?\\b|lernmaterial(ien)?|lerninhalt(e|en|s)?|lehrmaterial(ien)?|übung(en)?|uebung(en)?|aufgabe(n)?\\s+(zu|f(ü|ue)r)|f(ü|ue)r\\s+den\\s+unterricht|f(ü|ue)r\\s+meine\\s+klasse)\\b"
        value: "INT-W-03"
      # ---- Sehr generische Faktenfrage am Schluss ----
      - key: w06_factquestion
        match: "\\b(fakten\\s+(zu|über|ueber)|was\\s+(ist|sind|bedeutet|heißt)\\s+\\w+|wer\\s+(ist|war|hat|sind|steht|stehen)\\s+\\w+|welche\\s+\\w+\\s+(gibt\\s+es|gibts|hat\\s+wlo)|wie\\s+(funktioniert|läuft|geht\\s+das|nutze\\s+ich|verwende\\s+ich|benutze\\s+ich)\\s+\\w+|erkl(ä|ae)r(e|en|t)?\\s+(mir|sie)|woraus\\s+besteht|woher\\s+kommt|wozu\\s+(dient|braucht)|lizenz\\s+\\w+|cc\\s*by|wie\\s+heißt\\s+\\w+)\\b"
        value: "INT-W-06"
      # ---- Orientierungs-Rückführung (INT-W-11 → INT-W-02 bei vagem "ich bin neu") ----
      # Wenn der Classifier INT-W-11 (Erstellen) gewählt hat, der Text aber
      # nur generisches "ich bin neu / was geht hier" enthält (KEIN
      # Erstell-Verb — w11_create steht oben und greift zuerst), dann
      # ist es eigentlich Orientierung.
      - key: w02_orient
        match: "\\b(ich\\s+bin\\s+(neu|hier\\s+neu)|gerade\\s+neu\\s+hier|frisch\\s+hier|noch\\s+(nicht|nie)\\s+benutzt|was\\s+(kann|bietet|macht)\\s+(wlo|wirlernenonline|der\\s+chatbot|die\\s+plattform|ihr|du)|was\\s+gibt\\s+(es|s)\\s+(hier|auf\\s+wlo)|erste\\s+orientierung|orientierung\\s+(über|auf|in)\\s+wlo|einstieg\\s+in\\s+wlo|wlo\\s+kennenlernen)\\b"
        value: "INT-W-02"

  # ── Welle C Sprint 6 Hotfix: Universal-Statistik-Anchor ────────────
  # Eval-Befund (eval-3799fcfd): P-W-SL fragt nach Plattform-Statistik
  # ("Anzahl der Materialien im letzten Quartal"). Classifier erkannte
  # INT-W-03 → ``lookup_intent_recheck_anchors`` feuert nicht
  # (when_extra: intent ∈ {INT-W-02, INT-W-11}). Bot landet bei PAT-28
  # (Themenseiten-Suche) statt PAT-10 (Fakten-Bulletin) → liefert keine
  # Statistik, sondern Such-Treffer.
  #
  # Diese Lookup-Group greift bei JEDEM Classifier-Intent: sobald
  # Statistik-Anker erkannt werden, Override auf INT-W-09 →
  # ``lookup_intent_forces_pattern`` schickt PAT-10 raus, das antwortet
  # ehrlich aus RAG-Wissen oder degradiert sauber ("dazu liegen mir
  # gerade keine Zahlen vor").
  - id_prefix: lookup_statistics_anchor
    description: "Klare Statistik-/Reporting-Marker → INT-W-09 (greift bei JEDEM Classifier-Intent)."
    priority: 78
    live: true
    when_path: message
    when_op: regex
    then_field: intent_override
    items:
      - key: stats_quartal_jahr
        match: "\\b(anzahl\\s+(der|von|an)\\s+\\w+|wie\\s+viele\\s+\\w+\\s+(insgesamt|im\\s+quartal|im\\s+jahr|im\\s+letzten|wurden|gibt|sind|haben\\s+wir|nutzen|hatten)|im\\s+letzten\\s+(quartal|jahr|halbjahr|monat)|aktuelle\\s+anzahl|gesamt-?zahl|statistik(en)?|reichweite|nutzungs(zahlen|trend(s)?)|reporting|auswertung)\\b"
        value: "INT-W-09"

  # ── Welle C Sprint 6 Hotfix: Universal-Feedback-Anchor ──────────────
  # ``lookup_intent_recheck_anchors`` greift NUR wenn Classifier-Intent
  # bereits INT-W-02 oder INT-W-11 ist. Eval-Run eval-3799fcfd zeigte:
  # Wenn der Classifier bei einer Folge-Antwort wie "Das hat nicht
  # geklappt" auf INT-W-03/06/10/12 verharrt, feuert die Feedback-Erkennung
  # nicht — der User-Frust geht ins Leere, Bot baut einfach ein neues
  # Material/Lernpfad.
  #
  # Diese Lookup-Group hat KEIN ``when_extra`` — sie greift bei JEDEM
  # Intent, sobald der User klare Feedback-Marker ("hat nicht geklappt",
  # "verwirrend", "schade dass", "funktioniert nicht") nutzt. Folge:
  # Intent-Override auf INT-W-04 → ``lookup_intent_forces_pattern`` schickt
  # PAT-22 (Feedback-Echo) raus.
  #
  # Priority 78: über lookup_intent_recheck_anchors (82) wäre zu früh —
  # wir wollen erst dass der spezifischere recheck-Lookup eine Chance hat,
  # dann fängt dieser hier den Rest auf. First-write-wins.
  - id_prefix: lookup_feedback_anchor
    description: "Klare Feedback-Marker → INT-W-04 (greift bei JEDEM Classifier-Intent)."
    priority: 78
    live: true
    when_path: message
    when_op: regex
    then_field: intent_override
    items:
      - key: feedback_negative
        match: "\\b(das\\s+hat\\s+nicht\\s+geklappt|hat\\s+nicht\\s+funktioniert|funktioniert\\s+nicht|ist\\s+verwirrend|das\\s+ist\\s+verwirrend|schade\\s+dass|enttäuschend|frustrierend|nicht\\s+das\\s+(was|wonach)\\s+ich)\\b"
        value: "INT-W-04"
      - key: feedback_positive
        match: "\\b(das\\s+(war|ist|hat)\\s+(hilfreich|gut|super|toll|spitze|geholfen|mir\\s+geholfen)|tipps?\\s+(waren|fand)\\s+(gut|hilfreich)|du\\s+hast\\s+mir\\s+(geholfen|sehr\\s+geholfen))\\b"
        value: "INT-W-04"

  # ── Intent → Pattern Force (ersetzt 4× rule_int_w_*_forces_*) ──
  # Intent-spezifische Patterns sollen für ihren Intent immer gewinnen,
  # auch wenn z.B. PAT-02 durch Signal-Bonus knapp führt.
  - id_prefix: lookup_intent_forces_pattern
    description: "Pflicht-Pattern pro Intent (deterministisches Override)."
    priority: 55
    live: true
    when_path: intent
    when_op: eq
    then_field: enforced_pattern_id
    items:
      - key: w04_to_pat22
        match: "INT-W-04"
        value: "PAT-22"
      - key: w05_to_pat23
        match: "INT-W-05"
        value: "PAT-23"
      # w07_to_pat24 GELÖSCHT (Welle C Sprint 4): INT-W-07 in INT-W-03
      # gemerged, PAT-24 entfernt — Download-Anfragen sind Such-Anfragen
      # mit Repo-Link-Output, das macht PAT-07/PAT-14/PAT-09 sowieso.
      - key: w08_to_pat03
        match: "INT-W-08"
        value: "PAT-03"
