# Intent-Definitionen
# Jeder Intent hat eine ID, ein Label und eine Beschreibung.
# Diese werden für die LLM-Klassifikation und im Studio verwendet.

intents:
  - id: INT-W-01
    label: WLO kennenlernen
    description: "Nutzer:in begegnet WLO ZUM ERSTEN MAL und will einen ÜBERBLICK was die Plattform überhaupt ist und macht. Typische Trigger: 'Was ist WirLernenOnline?', 'Was kann ich hier?', 'Worum geht's auf dieser Seite?', 'Stell dich vor', 'Wer steckt dahinter?'. ABGRENZUNG: Konkrete Detail-Fragen über WLO-Konzepte (was ist eine Themenseite, was ist OER, wie funktioniert Schule.cloud-Anbindung) gehen nach INT-W-06 (Faktenfragen). INT-W-01 ist nur die offene 'Hi, was ist das hier?'-Erst-Begegnung."

  - id: INT-W-02
    label: Soft Probing
    description: "Nutzer:in stellt eine VAGE Orientierungs-/Erkundungs-Anfrage ohne konkretes Anliegen — will sich erst umschauen, bevor sie sich entscheidet. Typische Trigger: 'Was kann ich hier?', 'Ich schau mal', 'Erstmal umsehen', 'Was gibt es?', 'Ich orientiere mich gerade', 'Ich überleg noch was', 'Ich bin neu hier'. **KRITISCHE ABGRENZUNG**: NICHT INT-W-01 (WLO kennenlernen) — das ist 'Was IST WirLernenOnline?'. NICHT INT-W-06 (Faktenfragen) — das ist eine konkrete Frage. NICHT INT-W-09 (Analyse) — das wäre Statistik. NICHT INT-W-04 (Feedback) — das wäre eine Bewertung der Antwort. NICHT INT-W-05 (Routing Redaktion) — das wäre Fehlerhinweis. NICHT INT-W-08 (Inhalte evaluieren) — das wäre Bewertung eines konkreten Materials. NICHT INT-W-10/11 — sobald 'plane / erstelle / generiere' fällt. **HARTE REGEL**: Sobald die Nachricht ein konkretes Fach (Mathe/Bio/Chemie...), Thema (Bruchrechnen/Klimawandel...), Verb (suchen/erstellen/herunterladen/melden/bewerten) ODER ein klares Aktions-Anliegen enthält, ist es NICHT INT-W-02 — sondern der zugehörige Such-/Erstell-/Bewerten-Intent. INT-W-02 ist NUR für reine Orientierung ohne jeden konkreten Anker. Hybride wie 'ich gucke mal, was es zu Mathe gibt' kippen auf INT-W-03a/03b (Suche), nicht 02. Signal: orientierungssuchend, neugierig. State: meist state-1."

  - id: INT-W-03a
    label: Themenseite entdecken
    description: "Nutzer:in sucht eine kuratierte Themenseite/Sammlung zu einem KONKRETEN Fachgebiet, Thema oder Begriff — das ist die GRÖSSERE Strukturebene als Einzel-Material. Typische Trigger: 'Themenseite zu X', 'Sammlung zu Y', 'Übersicht zu Z', 'Wo finde ich was zu W?', 'Hauptseite Mathematik', 'Bereich Klimawandel', 'Gibt es eine Themenseite zu Q?', 'ich suche die Themenseite zu Mathematik', 'Themenseite für Bruchrechnung'. **POSITIV-BEISPIELE (klare INT-W-03a-Treffer)**: 'Themenseite zu Mathematik' ✅. 'Ich suche die Themenseite zu Photosynthese' ✅. 'Hauptseite Klimawandel' ✅. 'Sammlung zu Bruchrechnung' ✅. 'Wo finde ich was zu Eiszeit?' ✅. 'Übersicht zu Goethe' ✅. 'Bereich Algebra' ✅. **KRITISCHE ABGRENZUNG**: (1) NICHT INT-W-03b (Material suchen) — das wären konkrete Arbeitsblätter/Videos/Aufgaben mit Such-Verb ('zeig mir / finde / suche / hast du / brauche Material zu X'). 'Themenseite/Sammlung zu X' bezieht sich auf die KURATIERTE EINSTIEGSSEITE, nicht einzelne Files. (2) NICHT INT-W-13 (Fachportale-Übersicht) — das wäre eine Plural-Frage nach ALLEN Fächern OHNE Nennung eines konkreten Fachs. Sobald der User 'Themenseite zu [konkretes Fach]' sagt, ist es INT-W-03a, NIE INT-W-13. (3) NICHT INT-W-14 (Drilldown) — das wären die Sub-Sammlungen UNTER einem Fach ('welche Themen gibt es unter Mathematik?', 'gliedere Biologie auf'). INT-W-03a sucht die THEMENSEITE selbst, INT-W-14 sucht ihre Untergliederung. **Diskriminator**: Wenn das Wort 'Themenseite', 'Hauptseite', 'Sammlung', 'Übersicht', 'Bereich' + 'zu/für [konkretes Thema/Fach]' im Trigger fällt → INT-W-03a. Wenn 'gliedern / aufteilen / Unterthemen / Bereiche von / Sub-Themen' fällt → INT-W-14. Wenn 'Material / Arbeitsblatt / Video / Aufgabe' im Trigger fällt → INT-W-03b. Tools: search_wlo_topic_pages (PRIMÄR), search_wlo_collections (Fallback). Pattern: PAT-28."

  - id: INT-W-03b
    label: Unterrichtsmaterial suchen
    description: "Nutzer:in sucht KONKRETE EINZEL-Materialien für DEN UNTERRICHT — typischerweise Lehrkräfte/Berater oder Eltern, die Material für den schulischen Einsatz brauchen. Typische Trigger: 'Arbeitsblatt zu X' (mit such-implizierendem Kontext), 'Aufgaben zu Y für Klasse 6 finden', 'Material für meine Stunde suchen', 'Übungen für die Schüler:innen brauche ich', 'Video für den Unterricht zeig mir', 'Hast du was zu X?'. **KRITISCHE ABGRENZUNG zu INT-W-11 (Inhalt erstellen)**: SUCH-VERBEN ('suche / finde / zeig / hast du / gib mir / brauche / wo finde ich') → INT-W-03b. ERSTELLUNGS-VERBEN ('erstelle / generiere / mach mir / schreib mir / baue / lass machen') → INT-W-11. Diskriminator-Beispiele: 'Hast du ein Arbeitsblatt zu X?' = INT-W-03b. 'Mach mir ein Arbeitsblatt zu X' = INT-W-11. 'Kannst du mir ein Arbeitsblatt erstellen?' = INT-W-11 (das Verb 'erstellen' dominiert). 'Kannst du mir ein Arbeitsblatt zeigen?' = INT-W-03b (das Verb 'zeigen' dominiert). **NICHT INT-W-03c (Lerninhalt suchen)** — das ist Selbst-Lernen ('ich verstehe X nicht', 'erklär mir Y'). **NICHT INT-W-10 (Unterrichtsplanung)** — das ist KEIN Einzel-Material, sondern eine STRUKTURIERTE EINHEIT/Stunde mit mehreren Schritten ('plane mir eine Stunde', 'Stundenentwurf zu X', 'Lernpfad zu Y'). Faustregel: konkrete Material-Anfrage mit Such-Verb (Singular oder Liste, kein Strukturieren, kein Erstellen) = INT-W-03b. Strukturieren oder Lernpfad = INT-W-10. Erstellungs-Verb = INT-W-11. Selbst-Lernen ohne Unterrichtsbezug = INT-W-03c."

  - id: INT-W-03c
    label: Lerninhalt suchen
    description: "Nutzer:in sucht Inhalt zum SELBST-LERNEN oder Verstehen — typischerweise Schüler:in oder Eltern für ihr Kind, NICHT für den Unterricht. Typische Trigger: 'Ich check X nicht', 'Erklär mir Y Schritt für Schritt', 'Wie geht das mit Z?', 'Mein Sohn versteht das nicht, kannst du erklären', 'Brauche Lerninhalt zu W', 'Video zum verstehen', 'Nachhilfe zu Q', 'Ich verstehe Mathe nicht so gut, erklär mir...'. **DOPPEL-TRIGGER (sehr starker Indikator)**: Sobald die Nachricht ZWEI dieser Signale kombiniert, ist es ZWINGEND INT-W-03c, NIEMALS INT-W-06: (a) ein Verstehen-Defizit-Verb ('verstehe nicht', 'check ich nicht', 'kapiere ich nicht', 'kommt nicht an', 'rafft nicht', 'ist mir unklar'), (b) eine Erklär-Bitte mit Lernformat ('Schritt für Schritt', 'einfach erklärt', 'so dass ich es verstehe', 'mit Beispiel', 'für die Klasse X'). Beispiel: 'Ich verstehe Mathe nicht, kannst du das mit Bruchrechnung Schritt für Schritt erklären?' = ZWINGEND INT-W-03c (verstehe-nicht + Schritt-für-Schritt = doppelter Trigger), NIE INT-W-06. **KRITISCHE ABGRENZUNG zu INT-W-06 (Faktenfragen)**: INT-W-06 fragt nach EINER kurzen, atomaren Antwort ohne Defizit-Indikator ('Was ist X?', 'Wie heißt Y?', 'Was bedeutet die Lizenz CC BY?'). INT-W-03c verlangt LERNMATERIAL/Erklärungs-RESSOURCEN — der User signalisiert, dass er etwas LERNEN/VERSTEHEN will, nicht nur eine Definition braucht. Diskriminator: '...verstehe nicht / Schritt für Schritt / nochmal erklären / Nachhilfe / Übung' → INT-W-03c. 'Was ist X / Wie heißt / Was bedeutet' (ohne Defizit-Hinweis) → INT-W-06. Bei 'erklären'-Verb: wenn der User sagt, er KAPIERE es nicht und braucht Material zum LERNEN → 03c. Wenn er nur eine Definition will → 06. **NICHT INT-W-03b (Unterrichtsmaterial)** — dort ist es Material FÜR den Unterricht. **NICHT INT-W-10 (Unterrichtsplanung)** — auch wenn das Wort 'Lernpfad' fällt, ist 'Lernpfad ERSTELLEN' eine Planung (10), 'Lernpfad zum Verstehen' eher 03c. Faustregel: 'Ich/mein Kind soll lernen/verstehen' = INT-W-03c. 'Material für die Klasse / den Unterricht' = INT-W-03b. Selbst-Lerner-Anliegen mit Verb wie 'verstehen, lernen, erklären' + Lern-Kontext = INT-W-03c. Wird vom Classifier zusammen mit 03a/03b als Such-Intent-Gruppe erkannt (chat.py:_spec_search_intents)."

  - id: INT-W-04
    label: Feedback
    description: "Nutzer:in gibt RÜCKMELDUNG (positiv oder negativ) zum Bot, zur Antwort, zur UX oder zur Plattform — KEINE Inhalts-Anfrage, sondern eine Bewertung/Anmerkung. Typische Trigger: 'Das war hilfreich', 'Das hat nicht geklappt', 'Tipps fand ich gut', 'Das ist verwirrend', 'Du hast nicht verstanden was ich meinte', 'Funktioniert nicht', 'Schade dass...', 'Danke'. **KRITISCHE ABGRENZUNG**: NICHT INT-W-05 (Routing Redaktion) — das wäre 'Bitte an Redaktion weiterleiten' / 'Fehler im Inhalt'. NICHT INT-W-08 (Inhalte evaluieren) — das wäre 'Wie gut ist DAS Material?'. INT-W-04 ist immer eine Aussage über die Interaktion/Plattform/UX selbst. Reagiere bestätigend + Frage nach mehr Detail wenn negativ."

  - id: INT-W-05
    label: Routing Redaktion
    description: "Nutzer:in MELDET einen INHALTLICHEN Fehler/eine Lücke ODER bittet um Weiterleitung an die Redaktion ODER will Material einreichen. Typische Trigger: 'an die Redaktion weiterleiten', 'an Redaktion melden', 'Ich habe einen Fehler gefunden', 'Hier ist was falsch', 'Da stimmt was nicht', 'Es fehlen Materialien zu X', 'Könnt ihr ergänzen?', 'Wie kann ich eigene Materialien hochladen?', 'Wo melde ich Bug?'. **KRITISCHE ABGRENZUNG**: NICHT INT-W-04 (Feedback) — das wäre 'Bot/UX hat nicht funktioniert'. INT-W-05 ist immer ein KONKRETER FEHLER/WUNSCH zu KONTENT der weitergeleitet/dokumentiert werden soll. Die Anfrage zielt auf eine REDAKTIONELLE Aktion, nicht auf eine Bot-Antwort. Faustregel: 'Fehler/Lücke/einreichen/weiterleiten' im Trigger = INT-W-05."

  - id: INT-W-06
    label: Faktenfragen
    description: "Nutzer:in fragt nach einer KONKRETEN, KURZ beantwortbaren FAKTISCHEN Auskunft (Definition, Zahl, Datum, Eigenschaft, Lizenz, Beziehung zwischen Begriffen) OHNE Verstehen-Defizit. Typische Trigger: 'Was ist X?', 'Wie groß/viele/lang ist Y?', 'Wer hat X erfunden?', 'Was bedeutet die Lizenz CC BY?', 'Was ist der Unterschied zwischen Themenseite und Sammlung?', 'Wie heißt der Anbieter von X?'. **HARTE NEGATIV-REGEL gegen INT-W-03c**: Sobald die Nachricht ein VERSTEHEN-DEFIZIT-Verb enthält ('verstehe nicht', 'check ich nicht', 'kapiere ich nicht', 'kommt nicht an', 'rafft nicht', 'ist mir unklar', 'mein Kind versteht nicht') ODER um eine Schritt-für-Schritt-/Erklär-/Lerngabe bittet ('Schritt für Schritt', 'einfach erklärt', 'mit Beispielen', 'so dass ich es verstehe') → IMMER INT-W-03c, NIEMALS INT-W-06. Beispiel: 'Ich verstehe Mathe nicht, kannst du das mit Bruchrechnung Schritt für Schritt erklären?' = INT-W-03c (zwei Defizit-/Lerntrigger), NIE INT-W-06. **KRITISCHE ABGRENZUNG**: NICHT INT-W-01 (WLO kennenlernen) — das ist nur 'Was ist WLO/WirLernenOnline?' als Erst-Begegnungs-Frage. NICHT INT-W-09 (Analyse & Reporting) — das sind Stat-Berichte, Dashboard-Ausgaben, größere Zahlen-Aggregate ('Wie viele OER hat WLO insgesamt?', 'Reichweite-Statistik'). NICHT INT-W-03c (Lerninhalt) — siehe oben (Defizit-/Lerntrigger). Faustregel: Wenn der User eine FAKTISCHE Antwort in 1-3 Sätzen erwartet OHNE Lern-Kontext → INT-W-06. Wenn der User EXPLIZIT signalisiert 'ich verstehe es nicht / erklär mir Schritt für Schritt / mein Kind kapiert es nicht' und LERN-RESSOURCEN braucht → INT-W-03c. Faktenfragen sind atomar (eine konkrete Frage, kurze Antwort), Analysen sind aggregiert (Berichte, Verläufe, Vergleiche). Bei Faktenfragen über die Plattform-Konzepte (was ist eine Themenseite, was bedeutet OER, wie funktioniert die WLO-Suche) ist es INT-W-06, nicht INT-W-01."

  - id: INT-W-07
    label: Material herunterladen
    description: "Nutzer:in will ein KONKRETES, BEREITS BEKANNTES Material herunterladen, öffnen oder als Datei beziehen — nicht erst suchen, sondern ausgeben. Typische Trigger: 'Lade X herunter', 'Wo ist der Download?', 'Wie kann ich das speichern?', 'Kannst du das als PDF schicken?', 'Wie öffne ich Y?', 'Direktlink zu Z bitte', 'Ich brauche die Datei', 'Where to get the file'. **KRITISCHE ABGRENZUNG**: NICHT INT-W-03b (Material suchen) — das wäre 'Such mir Arbeitsblätter zu X' (vor Material-Auswahl). NICHT INT-W-11 (Inhalt erstellen) — das wäre 'Erstelle mir ein neues Material'. INT-W-07 setzt voraus, dass das Zielmaterial schon identifiziert ist (über vorigen Turn oder Kontext). Reagiere mit Download-Hinweis + Lizenz, ggf. Alternative bei DRM."

  - id: INT-W-08
    label: Inhalte evaluieren
    description: "Nutzer:in fragt nach BEWERTUNG/EIGNUNG/QUALITÄT eines KONKRETEN Materials — z.B. ob es passt, gut ist, korrekt ist, lizenz-konform ist. Typische Trigger: 'Ist das Material gut?', 'Passt das für Klasse 6?', 'Wie gut ist DAS hier?', 'Welche Lizenz hat dieses Video?', 'Kann ich das verwenden?', 'Ist das didaktisch sinnvoll?', 'Beurteile mir X'. **KRITISCHE ABGRENZUNG**: NICHT INT-W-03b/c (Material suchen) — das wäre eine offene Such-Anfrage. NICHT INT-W-04 (Feedback) — das wäre Rückmeldung zum Bot. NICHT INT-W-09 (Statistik) — das wären Aggregate. INT-W-08 ist immer ein konkretes Single-Material das beurteilt werden soll. Antwort: Bewertungskriterien anbieten + nach dem Material/Link fragen, falls nicht im Kontext."

  - id: INT-W-09
    label: Analyse & Reporting
    description: "Nutzer:in braucht AGGREGIERTE Statistiken, Reports, Verläufe oder Mehr-Dimensionale Übersichten — keine atomare Einzelfakten. Typische Trigger: 'Reichweite letzten Quartal', 'Anzahl OER nach Bildungsstufe', 'Wie viele Materialien insgesamt?', 'Statistik zu X', 'Trend der Nutzung', 'Wie haben sich die Treffer entwickelt?'. ABGRENZUNG: Eine einzelne Zahlen-Frage wie 'Wie heißt der Anbieter?' oder 'Was kostet X?' ist INT-W-06 (Faktenfragen). INT-W-09 sind Dashboard-/Report-artige Anfragen mit mehrfachen Dimensionen (Zeit + Stufe + Fach), oft für Verwaltung, Berater, Politik."

  - id: INT-W-10
    label: Unterrichtsplanung
    description: "Nutzer:in (typischerweise Lehrkraft) plant eine STRUKTURIERTE Unterrichts-Einheit, Stunde oder einen Lernpfad — kein Einzel-Material. Typische Trigger: 'Plane mir eine Stunde zu X', 'Unterrichtsentwurf für Y', 'Lernpfad zu Z', 'Reihe zu W in 4 Stunden', 'Stundenentwurf', 'Unterrichts-Einheit zu Q', 'Welche Schritte für eine Stunde zu V?'. **KRITISCHE ABGRENZUNG**: NICHT INT-W-03b (Unterrichtsmaterial) — das wäre ein einzelnes Arbeitsblatt/Video/Aufgabe. INT-W-10 ist immer eine MEHRSCHRITTIGE STRUKTURIERUNG (Plan, Pfad, Reihe). Faustregel: 'Plane / Strukturiere / Stunde / Einheit / Pfad / Reihe' im Trigger = INT-W-10. 'Arbeitsblatt / Video / Material zu X' = INT-W-03b. Bei Hybriden ('Arbeitsblätter für eine Reihe') tendiere zu INT-W-10, weil der Plan die übergeordnete Anfrage ist."

  - id: INT-W-11
    label: Inhalt erstellen
    description: "Nutzer:in möchte ein neues Material KI-generiert erstellen lassen (Arbeitsblatt, Infoblatt, Quiz, Präsentation, Checkliste, Glossar, Strukturübersicht, Übungsaufgaben, Lerngeschichte, Versuchsanleitung, Diskussionskarten, Rollenspielkarten, Bericht, Factsheet, Projektsteckbrief, Pressemitteilung, Vergleich). **KRITISCHE ABGRENZUNG zu INT-W-03b (Suchen)**: 'Zeig mir / Suche / Finde / Brauche / Hast du Material zu X' ist INT-W-03b (Suchen). 'Erstelle / Generiere / Mach mir / Schreib mir / Bau ein neues Material zu X' ist INT-W-11. Diskriminator: ERSTELLUNGS-VERB ('erstelle', 'generiere', 'mach mir', 'schreib mir', 'baue', 'fertige an', 'lass dir was einfallen') → INT-W-11. SUCH-VERB ('suche', 'finde', 'zeig', 'hast du', 'gib mir', 'brauche') → INT-W-03b. Bei Hybriden ('Brauche ein Arbeitsblatt zu X — kannst du mir eines erstellen?') hat das ERSTELLUNGS-VERB Vorrang → INT-W-11. **NICHT INT-W-10 (Unterrichtsplanung)**: das ist eine MEHRSCHRITTIGE Stunde/Reihe/Lernpfad. INT-W-11 ist EIN Material. **NICHT INT-W-09 (Analyse)**: 'erstelle einen Bericht/Statistik' (mit Daten-Aggregation) ist eher INT-W-09, wenn aggregierte Zahlen rauskommen sollen — INT-W-11 ist content-fokussiert (Lehrmaterial). **NICHT INT-W-02 (Soft Probing)**: ein Erstellungs-Verb ist NIE soft, immer harte Aktion."

  - id: INT-W-12
    label: Canvas-Edit
    description: "Nutzer:in möchte den bereits im Canvas befindlichen Inhalt VERFEINERN oder ÄNDERN (nicht neu erstellen). Typische Trigger: 'mach es einfacher', 'kürzer', 'ausführlicher', 'füge X hinzu', 'formuliere Y um', 'streiche Z', 'ändere den Titel', 'nochmal, aber mit Lösung'. Voraussetzung: state-12 (Canvas-Arbeit) ist aktiv und es existiert bereits Canvas-Content. ABGRENZUNG: Wenn state-12 NICHT aktiv oder kein Canvas-Content vorhanden, ist es INT-W-11 (Erstellen)."

  - id: INT-W-13
    label: Fachportale entdecken
    description: "Nutzer:in möchte einen Überblick über ALLE bei WLO verfügbaren Fachportale / Schulfächer / Top-Level-Sammlungen sehen — als Einstiegspunkt für eine geführte Drilldown-Navigation oder zur Orientierung, was die Plattform abdeckt. Typische Trigger: 'welche Fächer gibt es?', 'zeig mir alle Fachportale', 'was kann ich auf WLO entdecken?', 'gibt es ein Portal für Sport?', 'Übersicht der Fächer'. **KRITISCHE ABGRENZUNG**: (1) Wenn der Nutzer EIN KONKRETES Fach nennt UND nach Unter-Bereichen / Unter-Themen / Aufgliederung fragt ('welche Unterthemen für Mathematik?', 'Bereiche unter Biologie?', 'wie ist Informatik gegliedert?', 'welche Unterkategorien gibts bei X?'), ist es **INT-W-14 (Drilldown in EIN Fach)**, NICHT INT-W-13 (Übersicht ALLER Fächer). (2) Wenn der Nutzer 'Themenseite zu / für [konkretes Fach oder Thema]', 'Hauptseite [Thema]', 'Sammlung zu [Thema]', 'ich suche die Themenseite zu X' sagt, ist es **INT-W-03a (Themenseite entdecken)**, NICHT INT-W-13 — der User sucht eine SPEZIFISCHE Themenseite, nicht die Fachportal-Übersicht. **Negativ-Beispiele für INT-W-13**: 'Themenseite zu Mathematik' = INT-W-03a ❌ INT-W-13. 'Ich suche die Themenseite zu Photosynthese' = INT-W-03a ❌ INT-W-13. 'Hauptseite Klimawandel' = INT-W-03a ❌ INT-W-13. 'Welche Themen gibt es unter Mathematik?' = INT-W-14 ❌ INT-W-13. 'Zeig mir Material zu Mathe' = INT-W-03b ❌ INT-W-13. **Faustregel**: PLURAL/EXISTENZ-Frage nach ALLEN Fächern = INT-W-13. SINGULAR-Fach-Frage mit Drilldown-Verb = INT-W-14. SINGULAR-Frage 'Themenseite/Sammlung zu [X]' = INT-W-03a. 'Erklär mir was Themenseiten sind' = INT-W-06 (Faktenfragen über Plattform-Konzept). MCP-Tool für INT-W-13: get_subject_portals."

  - id: INT-W-14
    label: Themen-Drilldown
    description: "Nutzer:in hat eine Sammlung/Fachportal gefunden und möchte tiefer rein navigieren — die Sub-Themen / Sub-Sammlungen sehen, BEVOR konkrete Materialien angezeigt werden. Typische Trigger: 'welche Themen gibt es unter Mathematik?', 'zeig mir Bereiche unter Informatik', 'gliedere Biologie auf', 'in welche Unterthemen ist X aufgeteilt?', 'wie ist Informatik gegliedert?', 'wie ist X aufgebaut/strukturiert?', 'welche Kapitel/Teilbereiche hat X?', 'welche Themen sind unter Mathematik aufgeteilt für meinen Artikel?'. **KRITISCHE ABGRENZUNG zu INT-W-13 (Fachportale-Übersicht)**: INT-W-13 ist die PLURAL-Frage 'welche Fächer gibt es überhaupt?' — also der Top-Level-Überblick. INT-W-14 ist SINGULAR + Drilldown ('Unter-Bereiche von Mathematik'). Wenn ein KONKRETES Fach genannt wird UND nach Aufgliederung/Unter-Themen gefragt wird → IMMER INT-W-14, NIE INT-W-13. **WICHTIGE ABGRENZUNG zu INT-W-06**: 'wie ist X gegliedert?' / 'wie ist X aufgebaut?' ist NICHT INT-W-06 (Faktenfragen über Plattform/Konzept) sondern INT-W-14 (Drilldown), wenn X ein Fach oder ein Thema ist. 'Zeig mir Materialien aus Mathematik' ist INT-W-03b (Files, nicht Sub-Sammlungen). 'Zeig mir Inhalte einer Sammlung' ist Browse-Action mit get_collection_contents (Files). Hier ist es Sub-Folders. MCP-Tool: browse_collection_tree (depth 1 oder 2)."
