# ── Intent-Hard-Overrides ─────────────────────────────────────────
intent_overrides:
  - id: i07_feedback_bedienung
    description: Frage zur Bot-Bedienung / Feedback-Mechanik.
    intent: I07
    triggers:
      - wie kann ich Feedback geben
      - wie melde ich
      - wie sage ich dir
      - wie sage ich euch
      - Feedback geben
      - Schritt für Schritt feedback
      - wie funktioniert das hier

  - id: i03_search_verbs
    description: Such-Verben → I03 (Inhalte-Suchen, aus WLO-Repository).
    intent: I03
    triggers:
      - suche
      - such mir
      - ich suche
      - finde
      - find mir
      - zeig mir
      - hast du
      - hast du etwas
      - hast du was
      - was hast du
      - gibt es
      - was gibt es
      - welches Material
      - brauche
      - bereitstellen

  - id: i05_create_verbs
    description: Create-Verben → I05 (Inhalt-Generieren, KI-neu).
    intent: I05
    triggers:
      - erstelle
      - erstell mir
      - generiere
      - generier mir
      - mach mir ein
      - mach mir eine
      - schreib mir
      - bau mir
      - entwirf
      - produziere
      - erzeuge

# Konflikt-Regel: Bei beiden Verb-Typen gewinnt das ERSTE in der Nachricht.
intent_conflict_rule: |
  Wenn beide Verb-Typen (Such-Verb + Create-Verb) in der Nachricht
  vorkommen, gewinnt das ERSTE Verb in der Reihenfolge der Nachricht.
  Beispiel: 'Ich suche, kannst du etwas erstellen' → I03 (Suche
  kommt zuerst).

# ── Topic-Slot-Overrides ──────────────────────────────────────────
topic_overrides:
  phantom_topic_phrases:
    description: |
      Wenn der User 'zu einem Thema' / 'zu irgendwas' / 'zu etwas' als
      Ersatz für ein konkretes Topic nennt, ist topic LEER zu extrahieren.
    phrases:
      - einem Thema
      - ein Thema
      - irgendeinem Thema
      - irgendwas
      - irgendetwas
      - etwas
      - irgendein Thema
      - einem beliebigen Thema
      - beliebigem Thema

  fach_as_topic_fallback:
    description: |
      Wenn der User NUR ein Fach nennt (Mathe, Deutsch, Bio, ...) ohne
      konkreteres Thema → extrahiere fach=Fach UND topic=Fach
      (Fach-Fallback). M10/M03/M06 können damit arbeiten.
    triggers:
      - Mathe
      - Mathematik
      - Deutsch
      - Englisch
      - Französisch
      - Biologie
      - Bio
      - Physik
      - Chemie
      - Geschichte
      - Geographie
      - Politik
      - Wirtschaft
      - Religion
      - Ethik
      - Sport
      - Kunst
      - Musik

# ── Pattern-Disambiguatoren (DEPRECATED — siehe 03-patterns/*.md) ─────
# Welle E v4+7 (2026-05-26): Diese zentrale Liste ist veraltet. Die
# Disambiguatoren leben jetzt pro Pattern im Frontmatter der jeweiligen
# 03-patterns/*.md unter `discriminators:` (Single-Source-of-Truth).
# Der classify-Prompt rendert sie pro Pattern als Teil des Pattern-Hint-
# Blocks und der Eval-Judge bekommt sie über `_build_pattern_expectations`.
#
# Diese Liste hier wird aktuell IGNORIERT (siehe llm_service.py:_render_
# pattern_disambiguators_block — die Funktion wird nicht mehr aufgerufen).
# Wir lassen sie für 1-2 Wochen drin als Migrations-Anker; danach kann
# der ganze Block raus.
pattern_disambiguators_legacy:
  - id: m10_vs_m04
    label: M10 vs M04 (KI-Create vs Wissens-Antwort)
    rules:
      - 'Create-Verb (erstelle/generiere/mach mir/bau/schreib mir) + Material-Typ-Substantiv (Arbeitsblatt/Quiz/Infoblatt/Bericht/Factsheet/Übung) → M10.'
      - 'Was-Frage (Was ist X?/Wie funktioniert Y?/Wer hat Z entwickelt?) ohne Material-Typ → M04.'
    examples:
      - input: Erstell mir ein Quiz zu Photosynthese
        expected: M10
        rationale: 'Create-Verb + Material-Typ — NICHT M04, auch wenn Photosynthese ein Wissens-Thema ist.'
      - input: Was ist Photosynthese?
        expected: M04

  - id: m10_vs_m03
    label: M10 vs M03 (Create vs Slot-Klärung)
    rules:
      - 'I05 mit konkretem Topic UND Material-Typ → M10.'
      - 'I05 ohne Topic (oder Phantom-Topic etwas/einem Thema) → M03-Klärung.'
      - 'I05 ohne Material-Typ → M03-Klärung (Welches Format?).'

  - id: m09_vs_m06
    label: M09 vs M06 (Lernpfad vs Material-Suche)
    rules:
      - 'Plan-Verb (plane/Stundenentwurf/Unterrichtsreihe/Lernpfad/Materialzusammenstellung) → M09.'
      - 'Such-Verb + Material (zeig mir Material zu X/hast du was zu Y?) → M06 Cascade oder M05 gefiltert.'
      - 'Material zur Unterrichtseinheit X — Tie-Break: wenn User Material singulär nennt → M06; wenn er Reihe/Sequenz/mehrere Stunden nennt → M09.'

  - id: m06_vs_m05
    label: M06 vs M05 (Cascade vs gefiltert)
    rules:
      - 'Such-Anfrage mit Filter (Fach + Stufe + Medientyp) → M05.'
      - 'Such-Anfrage mit nur Thema (oder Thema + Fach allein) → M06 Cascade.'

  - id: m11_vs_m10
    label: M11 vs M10 (Edit vs neu generieren)
    rules:
      - 'Edit-Verb (kürzer/einfacher/umformulieren/ergänze/anpassen) + Bezug auf Vor-Inhalt + last_pattern in M09/M10/M11 → M11.'
      - 'Edit-Verb OHNE Vor-Inhalt (last_pattern leer/anders) → M10 (Bot generiert das Material zum ersten Mal).'

  - id: m14_vs_m03
    label: M14 vs M03 (Feedback vs Slot-Klärung)
    rules:
      - 'Wie kann ich Feedback geben? / Wie melde ich was? → I07 + M14.'
      - 'User antwortet auf eine Bot-Frage zur Spezifizierung → M03.'

  - id: m02_vs_m04
    label: M02 vs M04 (Domain-Out vs Wissens-Antwort)
    rules:
      - 'Frage zu Bildungs-/OER-/WLO-Themen → M04 (Wissens-Antwort).'
      - 'Frage AUSSERHALB Bildungsdomäne (Aktienkurse/Rezepte/Politik allgemein) → M02 (Domain-Out, freundlicher Redirect).'

