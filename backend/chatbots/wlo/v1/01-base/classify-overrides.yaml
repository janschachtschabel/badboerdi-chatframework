# Klassifikations-Overrides (Welle E v4+6, 2026-05-26)
# ─────────────────────────────────────────────────────
# Hard-Override-Regeln, Pattern-Disambiguatoren und Few-Shot-Beispiele für
# den classify-Prompt. Die Datei steuert wie das LLM-Klassifizier-Modell
# mehrdeutige User-Eingaben deterministisch auf Persona/Intent/Pattern
# abbildet. Studio-bearbeitbar — Änderungen wirken beim nächsten Turn
# ohne Backend-Restart (mtime-Cache).

# ── Persona-Hard-Overrides ────────────────────────────────────────
# Marker, die UNABHÄNGIG vom Markdown-Body der Persona-Datei eine harte
# Persona-Entscheidung erzwingen.
persona_overrides:
  - id: p_ler_self_id
    description: Tokens, die eindeutig eine:n Lerner:in/Schüler:in identifizieren.
    persona: P-LER
    triggers:
      - kapiere
      - kapiere nicht
      - verstehe nicht
      - check ich nicht
      - raff ich nicht
      - Klausur
      - Hausaufgabe
      - Schulaufgabe
      - ich lerne für
      - für meine Prüfung
      - für meinen Test
    except_explicit_role:
      - ich bin Lehrer:in
      - mein Kind
      - als Journalist:in
      - für meine Behörde

  - id: p_elt_self_id
    description: Possessiv-Pronomen für Kinder → Eltern.
    persona: P-ELT
    triggers:
      - mein Kind
      - meine Tochter
      - mein Sohn
      - unsere Kinder

  - id: p_leh_active
    description: meine Klasse + Verb wie unterrichten/planen → Lehrkraft.
