# Widget-Embed-Modi — Limits fürs Inline-Rendering.
# Host-seitige Feature-Flags gibt es nicht mehr (2026-06-10:
# ai-content-enabled entfernt — KI-generierte Inhalte sind immer aktiv).

widget_modes:
  cards_inline_link_limit: 5         # max. Inline-Links wenn cards=off [1..6]
  cards_inline_link_title_max: 70    # Titel-Länge mit Word-Boundary-Cut
