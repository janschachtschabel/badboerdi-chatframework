# Guide-Mode (Webseiten-Lotse) — Konfiguration
#
# Wenn Guide-Mode im Frontend aktiv ist und der Bot auf einer der
# unten gelisteten Domains läuft, reichert das Backend jede Material-
# bzw. Sammlungs-Card mit einem ``guide_url``-Feld an. Die Frontend-
# Component zeigt daneben einen "Bring mich hin"-Button, der den User
# (in derselben Browser-Tab) zu der WLO-Seite navigiert.
#
# Domains werden case-insensitive gegen ``window.location.hostname`` /
# ``page_context.host`` geprüft. ``*.example.com``-Wildcards matchen
# ALLE Subdomains (eine Ebene oder mehr).

guide_mode:
  # Default-Status des Frontend-Toggles. User kann jederzeit ein-/aus-
  # schalten — Wert wird in localStorage["boerdi.guide_mode"] gehalten.
  # Default OFF: User soll bewusst opt-in (Tab-Wechsel ist eine
  # Veränderung des bisherigen Verhaltens — neuer Tab → gleicher Tab).
  default_enabled: false

  # Hosts, auf denen der Guide-Modus überhaupt sichtbar ist. Auf jeder
  # anderen Domain wird der Toggle automatisch ausgeblendet und der
  # Modus implicit deaktiviert (= heute nutiges "neuer Tab"-Verhalten).
  allowed_hosts:
    - wirlernenonline.de
    - "*.wirlernenonline.de"
    - openeduhub.net
    - "*.openeduhub.net"
    - wissenlebtonline.de
    - "*.wissenlebtonline.de"
    # ── Verbundene Plattformen (RAG-Quell-Domains) ───────────────
    # Werden vom RAG-Wissensbestand referenziert (Frontmatter-source-
    # URLs in knowledge/sources/edu-sharing-*/ und /001-its-jointly.md).
    # Lotsen-Modus darf hierhin verlinken, weil die Inhalte zum
    # WLO-Ökosystem gehören.
    - edu-sharing.com
    - "*.edu-sharing.com"
    - edu-sharing.net
    - "*.edu-sharing.net"
    - edu-sharing-network.org
    - "*.edu-sharing-network.org"
    - its.jointly.info
    - "*.its.jointly.info"
    - jointly.info
    - "*.jointly.info"
    # ── Dev-Hosts (vor Production wieder entfernen) ──────────────
    # Diese Einträge erlauben das lokale Testen des Lotsen-Modus.
    # Auf einer Live-WLO-Seite haben sie keine Wirkung (kein Match
    # gegen ``window.location.hostname``), aber sauberer ist es, sie
    # vor dem Deploy zu entfernen.
    - localhost
    - 127.0.0.1
    - "*.nip.io"

  # Welche Card-URL-Felder als Guide-Ziel zulässig sind, in
  # Reihenfolge der Bevorzugung. Das erste Feld mit einem Wert, dessen
  # Host zur ``allowed_hosts``-Liste passt, wird als ``guide_url``
  # gesetzt. ``url`` ist der externe Default; ``wlo_url``/``preview_url``
  # zeigen meist auf das edu-sharing-Render der Sammlung.
  url_fields_priority:
    - topic_page_url
    - wlo_url
    - url
    - content_url
    - preview_url

  # Maximale Anzahl Cards pro Antwort, die einen Guide-Button bekommen.
  # 0 = unbegrenzt (jede Card mit allow-listed URL bekommt einen Button).
  # Bei aktivem Lotsen-Modus erwarten User Konsistenz: wenn der erste
  # Treffer einen "Bring mich hin"-Button hat, soll der Letzte das auch.
  # Eine Beschränkung war im MVP aus Vorsicht drin, erzeugt aber
  # Inkonsistenz (z.B. nur Sammlungen, keine Inhalte) — daher off.
  max_guide_targets_per_turn: 0

  # Maximale Anzahl Bring-mich-hin-Quick-Replies pro Bot-Antwort (von
  # insgesamt max. 4 Quick-Replies). Empfohlene Werte:
  #   1  konservativ  — nur 1 Lotsen-Button, 3 Folge-Fragen-QRs
  #   2  ausgewogen   — Hauptseite + Sub-Page o.ä., 2 Folge-QRs (DEFAULT)
  #   3  lotsen-lastig — 3 Bring-mich-hin, 1 Folge-QR (Chat-Flow eingeschränkt)
  # Werte >3 werden im Code auf 3 gekappt — sonst bleibt kein Platz für
  # eine sinnvolle Folge-Frage im Chat (UX-Anti-Pattern).
  max_guide_quick_replies: 2
