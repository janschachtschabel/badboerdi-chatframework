# Pattern-Engine Tie-Breaker Konfiguration (Bonus 2)
#
# Erlaubt es, in eng aufeinander folgenden Score-Kämpfen ("tight race")
# den LLM-Pattern-Hint als Tie-Breaker einzusetzen — selektiv pro Pattern.
# Ohne Aktivierung bleibt der Pattern-Hint reine Telemetrie (Shadow-Mode).
#
# Vorgehen:
#   1. Lass den Bot mit Shadow-Mode laufen (enabled: false) und sammle
#      Eval-Daten. In den Run-Summaries siehst du
#      `pattern_confusion_llm_vs_engine` — das zeigt Pattern-Cluster, in
#      denen LLM-Hint und Engine voneinander abweichen.
#   2. Identifiziere Cluster, in denen der Judge die LLM-Wahl
#      konsequent als pattern_match=2 einstuft (= LLM-Hint korrekt,
#      Engine daneben).
#   3. Trage diese Pattern-IDs in `allow_patterns_winner` ein und
#      setze `enabled: true`. Eng kalibrierter Override, kein
#      pauschales LLM-Vertrauen.
#
# Mechanik:
#   - Der Tie-Breaker greift nur, wenn:
#     * `enabled: true`
#     * Der Score-Gap zwischen Top-1 und Top-2 < `max_score_gap` ist
#     * Der LLM-Hint zu den Top-N Score-Patterns gehört
#       (`top_n_window`)
#     * Der Engine-Winner *oder* der LLM-Hint in `allow_patterns_winner`
#       enthalten ist (= Pattern-Cluster, in dem Override erlaubt ist)
#     * Der LLM-Hint nicht durch Safety/Pre-Route bereits enforced ist

tie_breaker:
  enabled: false
  max_score_gap: 0.05    # Override nur bei knappem Score-Gap
  top_n_window: 2        # LLM-Hint muss in den Top-N nach Score sein
  allow_patterns_winner: []  # Liste von Pattern-IDs (Engine-Winner ODER LLM-Hint),
                              # in denen Override erlaubt ist. Leere Liste = Shadow-Only.
