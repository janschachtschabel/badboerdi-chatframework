# Safety-Layer — Risiko-Gating vor Pattern-Selektion.
# Editierbar im Studio unter "1 — Identität & Schutz".

security_level: standard

presets:
  off:       { moderation: never,  legal_classifier: never, prompt_injection: false }
  regex:     { moderation: never,  legal_classifier: never, prompt_injection: true }
  standard:  { moderation: always, legal_classifier: never, prompt_injection: true }
  strict:    { moderation: always, legal_classifier: smart, prompt_injection: true, legal_trigger_override: true }
  paranoid:  { moderation: always, legal_classifier: always, prompt_injection: true, legal_trigger_override: true, threshold_multiplier: 0.5, double_check: true }

# Stufe 1: Regex-Gate (immer aktiv)
extra_crisis_terms: []
extra_pii_terms: []

crisis_blocked_tools:
  - search_wlo_collections
  - search_wlo_content
  - get_collection_contents

crisis_pattern: M01
threat_pattern: M02

# Stufe 2: LLM-Moderation
escalation:
  mode: smart                  # off | smart | always
  provider: openai             # openai | none — omni-moderation-latest, kostenfrei
  legal_classifier: true       # GPT-mini für DE-Rechtskategorien

  thresholds:
    self_harm: 0.50
    self_harm/intent: 0.25
    sexual: 0.70
    sexual/minors: 0.20
    violence: 0.80
    violence/graphic: 0.70
    hate: 0.80
    hate/threatening: 0.60
    harassment: 0.85
    harassment/threatening: 0.60
    illicit: 0.70
    illicit/violent: 0.50

  hard_block_categories:
    - self_harm
    - self_harm/intent
    - sexual/minors
    - illicit/violent
    - hate/threatening
    - harassment/threatening

  downgrade_false_positives: true

# Stufe 3: Confidence-Anpassung aus Tool-Outcomes
confidence_adjustments:
  error: -0.20
  empty: -0.10
  timeout: -0.15
  success: 0.05

# Rate-Limits (0 = unlimited) — wirken auf die ECHTE Verbindungs-IP (server-
# seitig), nicht auf client-gelieferte Werte.
# • per_session = feines Limit je Browser-Session (jeder Schüler-Browser hat
#   eine eigene Session) → bremst Einzel-Spam.
# • per_ip = GROBE Missbrauchs-Obergrenze. BEWUSST großzügig, weil in Schulen
#   viele Rechner hinter EINER Router-/NAT-IP sitzen (ganze Computerräume) —
#   soll nur Runaway-Bots stoppen, nicht eine Klasse drosseln.
# • ip_whitelist = bekannte Schul-/Partner-IPs ganz vom IP-Limit ausnehmen.
# Hinweis: Hinter einem Reverse-Proxy TRUST_FORWARDED_FOR=1 setzen, damit die
#   echte Client-IP aus X-Forwarded-For (1. Hop) gelesen wird.
rate_limits:
  enabled: true
  per_session:
    enabled: true
    requests_per_minute: 30
    requests_per_hour: 600
  per_ip:
    enabled: true
    requests_per_minute: 1200   # NAT-tauglich: voller Computerraum
    requests_per_hour: 30000
  ip_whitelist: []   # z.B. ["1.2.3.4"] für bekannte Schulnetze
  blocked_message: |
    Du hast aktuell zu viele Anfragen gestellt. Bitte warte einen Moment
    und versuche es gleich nochmal.

logging:
  enabled: true
  log_all_turns: false
  retention_days: 90
