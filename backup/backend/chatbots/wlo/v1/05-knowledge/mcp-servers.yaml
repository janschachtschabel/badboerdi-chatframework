# MCP-Server-Registry
# Registrierte MCP-Server fuer den Chatbot.
#
# Primary-Server (id=wlo-mcp): URL kommt aus der
# Env-Variable ``MCP_SERVER_URL`` (Default:
# https://wlo-mcp-server.vercel.app/mcp). Nicht in dieser YAML eintragen — sie
# wird vom Backend automatisch gefiltert.
#
# Weitere Server können über das Studio (System → MCP-Server →
# Hinzufuegen) frei verwaltet werden — sie bekommen ihre url
# regulaer aus dieser YAML.

servers:
- id: wlo-mcp
  name: WLO edu-sharing
  description: WirLernenOnline MCP-Server mit Such- und Metadaten-Tools
  enabled: true
  tools:
  - search_wlo_collections
  - search_wlo_content
  - get_collection_contents
  - get_node_details
  - lookup_wlo_vocabulary
  - search_wlo_topic_pages
  - get_subject_portals
  - browse_collection_tree
  - wlo_health_check
  - get_nodes_details
