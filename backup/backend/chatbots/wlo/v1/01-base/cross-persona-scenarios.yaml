# Cross-Persona-Scenarios — gezielte Tests untypischer Persona×Intent-Kombinationen
#
# Diese Datei definiert eine kuratierte Liste atypischer Combos für den
# Eval-Service.  Wenn `include_cross_persona: true` im Eval-Run gesetzt
# ist, generiert der Service zusätzlich diese Combos mit dem Marker
# `is_cross_persona: true`.
#
# Welle E (2026-05-17): Intent-IDs von INT-W-XX auf die neuen
# vereinfachten IDs (INT-LERNPFAD / INT-CREATE / INT-WISSEN / ...).
# Welle E Sprint 3: INT-PLATTFORM + INT-KONZEPT zu INT-WISSEN gemerged.
# migriert.  Pattern-Engine ist persona-agnostisch — diese Tests messen,
# ob der LLM-Hint die Edge-Cases robust auf die richtigen Welle-E-
# Patterns routet (P9/P11/P3 etc.).

cross_persona_scenarios:
  enabled: false

  combos:
    # ─── Schüler:in (P-W-SL) in Profi-Themen ──────────────────────
    - persona_id: P-W-SL
      intent_id: INT-LERNPFAD
      description: "Schüler:in fragt nach Unterrichts-/Lernpfad-Erstellung"
      expected_behavior: |
        P9 (Lernpfad) mit kindgerechter Tonalität — Selbst-Lern-Pfad
        statt Lehrkraft-Stundenplan. Nicht starr ablehnen.

    - persona_id: P-W-SL
      intent_id: INT-CREATE
      description: "Schüler:in will eigenes Lern-Material erstellen (Arbeitsblatt, Quiz)"
      expected_behavior: |
        P11 (KI-Inhalt-Erzeugung) mit SuS-Tone (locker, du-Form).
        Nicht ablehnen mit "das ist nur für Lehrkräfte".

    - persona_id: P-W-SL
      intent_id: INT-WISSEN
      description: "Schüler:in fragt nach Plattform-Statistiken/Reporting"
      expected_behavior: |
        P3 (Plattform-Info) mit ehrlicher Degradation: harte Zahlen wo
        RAG sie hat, sonst klare "habe ich nicht"-Antwort. Schüler-Tone.

    # ─── Eltern (P-ELT) im Lehrkraft-Modus ─────────────────────────
    - persona_id: P-ELT
      intent_id: INT-LERNPFAD
      description: "Eltern wollen Unterrichtsplan/Lernpfad (Hausunterricht, Nachhilfe)"
      expected_behavior: |
        P9 (Lernpfad) mit Eltern-Tone (Sie-Form, hilfsbereit, mehr
        Erklärung pro Schritt). Annahme: Eltern kennen Schul-Routine
        nicht.

    - persona_id: P-ELT
      intent_id: INT-CREATE
      description: "Eltern wollen neues Material erstellen (Förder-Material, Hausaufgaben-Hilfe)"
      expected_behavior: |
        P11 (KI-Inhalt-Erzeugung) mit Eltern-Tone. Nicht pauschal als
        "für Lehrkräfte reserviert" abweisen.

    # ─── Profis in Nutzer-Themen ───────────────────────────────────
    - persona_id: P-VER
      intent_id: INT-SUCHE-MATERIAL
      description: "Verwaltung/Politik sucht konkretes Lehrmaterial (statt Statistik)"
      expected_behavior: |
        P5 oder P6 (Material-Suche) wie bei Lehrkraft — auch Profi-
        Personas dürfen konkret Inhalte abfragen, nicht nur Aggregate.

    - persona_id: P-W-PRESSE
      intent_id: INT-CREATE
      description: "Presse will Material/Beispiel-Inhalt erstellen lassen"
      expected_behavior: |
        P11 (KI-Inhalt-Erzeugung) mit Presse-Tone (formal,
        kontextreich). Annahme: Beispiel-Material für einen Artikel.

    - persona_id: P-W-PRESSE
      intent_id: INT-LERNPFAD
      description: "Presse fragt nach Unterrichtsplanung für einen Artikel"
      expected_behavior: |
        P9 (Lernpfad) mit Presse-Tone. Nicht blockieren — Demo-Lernpfad
        ist legitime Use-Case für Berichterstattung.

    # ─── Beratung/Verwaltung in Material-Themen ────────────────────
    - persona_id: P-BER
      intent_id: INT-CREATE
      description: "Beratung erstellt Material für Klient:innen (Eltern/SuS)"
      expected_behavior: |
        P11 (KI-Inhalt-Erzeugung) mit Berater-Tone. Beratung adressiert
        Eltern/SuS, nicht selbst Endnutzer.

    - persona_id: P-VER
      intent_id: INT-SUCHE-MATERIAL
      description: "Verwaltung sucht konkretes Material (statt Reports)"
      expected_behavior: |
        P5 oder P6 (Material-Suche) mit kompakter Antwort. Kein
        Reporting-Modus.

    # ─── Anonym in fortgeschrittenen Themen ────────────────────────
    - persona_id: P-AND
      intent_id: INT-LERNPFAD
      description: "Anonym fragt nach Unterrichts-/Lernpfad-Erstellung"
      expected_behavior: |
        P13 (Slot-Klärung — "planst du als Lehrkraft oder selbst?")
        ODER P9 (Lernpfad) mit neutralem Tone. Nicht stumm bleiben.

    - persona_id: P-AND
      intent_id: INT-CREATE
      description: "Anonym will Material erstellen"
      expected_behavior: |
        P13 (Slot-Klärung) mit kurzer Klärung. Oder direkt P11 wenn
        Slot-Daten ausreichen.
