# Intent-Definitionen (Welle E Sprint 2, 2026-05-18)
#
# 11 Intents, jeder mit Description + 2–4 Few-Shot-Beispielen. Der
# Classifier-Prompt baut diese Listen ein — Beispiele helfen dem LLM,
# Drift-Anfällige Anfragen sauber zu klassifizieren.

intents:
  # Welle E Sprint 3 (2026-05-18): INT-PLATTFORM + INT-KONZEPT gemerged
  # zu INT-WISSEN — beide hatten als Bezugspattern den RAG-Pfad, der
  # Classifier konnte sie nicht zuverlässig trennen.
  - id: INT-WISSEN
    label: Wissens-/Definitions-Frage
    description: "Wissens-/Definitions-/Fakten-Frage über die Plattform Wissenlebtonline ODER über ein WLO-Ökosystem-Konzept (OER, Themenseite, Sammlung, Fachportal, edu-sharing, B-API). NUR bei klar gestellten Wissens-Fragen — NICHT bei 'Was kann ich hier machen' (das ist INT-UNKLAR), NICHT bei Material-Wunsch (das ist INT-SUCHE-MATERIAL). Bezugspattern: P3."
    examples:
      - "Was ist Wissenlebtonline?"
      - "Wer betreibt WLO und wie viele OER habt ihr?"
      - "Was ist OER?"
      - "Was ist eine Themenseite und wie ist sie aufgebaut?"

  - id: INT-SUCHE-MATERIAL
    label: Material-Suche
    description: "User will konkrete Bildungsinhalte abrufen — Videos, Arbeitsblätter, Übungen, Sammlungen. Mit oder ohne Filter (Medientyp, Klassenstufe, Fach). Bezugspattern: P5 (mit Filter) oder P6 (vage Cascade)."
    examples:
      - "Videos zu Bruchrechnung für 5. Klasse"
      - "Was habt ihr zu Klimawandel?"
      - "Material für meinen Unterricht in Mathe Klasse 7"
      - "Gibt es Arbeitsblätter zu Photosynthese?"

  - id: INT-BROWSE-THEMEN
    label: Themenbaum-Navigation
    description: "User will den Themenbaum erkunden — Fachportale auf Top-Level oder Drilldown in eine Sammlung. Strukturelle Übersicht gewünscht, keine konkrete Material-Trefferliste. Bezugspattern: P7 (Top-Level) oder P8 (Drilldown)."
    examples:
      - "Welche Fächer gibt es hier?"
      - "Zeig mir die Mathe-Sammlungen"
      - "Was ist alles unter Algebra zu finden?"
      - "Welche Themen gibt es im Fachportal Biologie?"

  - id: INT-LERNPFAD
    label: Lernpfad/Unterrichtsentwurf
    description: "User will einen STRUKTURIERTEN, sequenziellen Lernpfad oder Unterrichtsentwurf zu einem Thema, basierend auf existierenden WLO-Inhalten (KI kuratiert + ordnet). NICHT zu verwechseln mit INT-CREATE (komplett neuer Inhalt aus KI). Bezugspattern: P9."
    examples:
      - "Erstell mir einen Lernpfad zu Bruchrechnung"
      - "Plane eine Stunde zu Photosynthese"
      - "Unterrichtsentwurf für 7. Klasse zu Klimawandel"
      - "Bau mir einen Lernpfad zu Energie aus euren Sammlungen"

  - id: INT-REMIX
    label: Material-Remix
    description: "User will EXISTIERENDE WLO-Inhalte anpassen oder kombinieren. Quell-Inhalt aus dem Repo muss bekannt sein (Node-ID/URL/Card-Klick). NICHT zu verwechseln mit INT-EDIT-CANVAS (User bearbeitet generierten Canvas-Inhalt). Bezugspattern: P10."
    examples:
      - "Mach dieses Arbeitsblatt einfacher"
      - "Kombiniere diese 3 Sammlungen zu einem Material"
      - "Pass diese Übung für die 5. Klasse an"
      - "Erstell aus diesen 2 Inhalten ein zusammengefasstes Quiz"

  - id: INT-CREATE
    label: KI-Inhalt-Erzeugung
    description: "User will einen KOMPLETT NEUEN Inhalt erzeugt — kein vorhandenes Material als Quelle, sondern KI generiert. Klare Create-Verben + Material-Typ + Thema. Bezugspattern: P11."
    examples:
      - "Erstell ein Quiz zu Photosynthese"
      - "Generier ein Arbeitsblatt zu Bruchrechnung Klasse 5"
      - "Schreib einen Bericht zur OER-Statistik 2025"
      - "Mach mir einen Steckbrief zu Albert Einstein"

  - id: INT-EDIT-CANVAS
    label: Canvas-Edit
    description: "Canvas ist BEREITS offen, User fordert Anpassung am dort sichtbaren Inhalt. Folge-Turn, kein neuer Inhalt. Bezugspattern: P12."
    examples:
      - "Mach es einfacher"
      - "Füge Lösungen hinzu"
      - "Kürzer bitte"
      - "Pass das für 7. Klasse an"

  - id: INT-FEEDBACK
    label: Feedback
    description: "User gibt eine RÜCKMELDUNG — positiv oder negativ — zur vorigen Antwort, zum Bot oder zur Plattform. KEINE Material-Anfrage, KEIN Erstellungs-Wunsch. Bezugspattern: P14."
    examples:
      - "Das hat geholfen, danke!"
      - "Die Erklärung war super, danke"
      - "Das war verwirrend"
      - "Du hast nicht verstanden was ich meinte"

  - id: INT-MELDUNG
    label: Redaktions-Routing
    description: "User meldet einen inhaltlichen FEHLER, kaputten Link oder schlägt neues Material vor. Eskalation an Redaktion erwartet. Bezugspattern: P15."
    examples:
      - "Der Link in diesem Material funktioniert nicht"
      - "In dem Arbeitsblatt steht ein Fehler"
      - "Könnt ihr etwas zu Thema X ergänzen?"
      - "Wo kann ich Inhaltsvorschläge einreichen?"

  - id: INT-UNKLAR
    label: Unklar / Smalltalk
    description: "User-Anfrage ist unklar, reines Smalltalk oder generische Erkundungs-Frage ohne konkretes Anliegen. **Hierhin gehört auch 'Was kann ich hier machen?' / 'Was gibt es hier?'** — das ist KEIN Plattform-Wissen (INT-PLATTFORM), sondern eine offene Klärungsfrage. System routet zu P13 (Slot-Klärung)."
    examples:
      - "Hallo"
      - "Was kann ich hier machen?"
      - "Was gibt es hier?"
      - "Ich schau mich mal um"
